# Textile Transition Sector — Parameter Registry
# India Transition Lab | Provenance-tagged scientific parameters
#
# KEY SCIENCE:
#   India textile: Spinning (cotton/manmade fibre) + Weaving/Knitting + Processing/Dyeing
#   Energy profile: Process heat dominant (steam for dyeing/finishing = 60-70% of energy)
#   Fibre split: Cotton ~50%, Polyester ~45%, others ~5% (India 2024)
#   Polyester is petrochemical: energy for polymerisation + melt spinning
#   Cotton processing is water+heat intensive: 100-150 kg water per kg cloth
#   Recycled fibre: mechanically recycled cotton + chemically recycled polyester
#   Key decarbonisation: coal boilers → RE + heat pumps + green hydrogen for steam
#
# PROVENANCE TAGS:
#   FROZEN_EXTERNAL  — Physical constant
#   EXTERNAL         — Official/published source
#   EXTERNAL_PENDING — Source identified, data pending
#   PROJECT_PROPOSAL — Internal assumption

horizon:
  start_year: 2024
  end_year: 2070

port: 8003

discount_rate:
  value: 0.10
  provenance: PROJECT_PROPOSAL
  source: "MSME India textile sector WACC estimate"

# ── Sub-sectors ───────────────────────────────────────────────────────────────
# Model: production in Mt fibre/yr (yarn + fabric + made-up combined as "fibre equivalent")
# Intensity basis: GJ per tonne fibre equivalent
# Sub-sectors aggregated into production routes (by fuel/energy source)

# ── Routes ────────────────────────────────────────────────────────────────────
routes:
  Coal-Conventional:
    label: "Coal Boiler Conventional"
    description: "Coal/biomass boilers for steam + grid electricity — baseline India textile"
    existing_mt: 8.0              # Mt fibre equivalent/yr
    capex_usd_per_t: 120          # USD/t fibre/yr (incremental capex, mostly O&M driven)
    capex_provenance: EXTERNAL_PENDING
    source_capex: "MSME textile survey data; DPIIT 2023 textile cluster reports"
    fom_usd_per_t_yr: 18
    vom_residual_usd_per_t: 40
    availability: 0.90
    lifetime_yr: 20
    start_year: 2024
    lead_years: 1
    wacc_premium: 0.0
    max_ramp_mt_yr: 0.0           # No new coal-conventional; retire existing
    cutoff_year_cps: 2030
    cutoff_year_nzs: 2027
    fossil_decline: true

    # Energy intensities
    coal_gj_per_t: 16.0           # GJ coal per t fibre (steam for dyeing/finishing)
    elec_kwh_per_t: 2800          # kWh/t fibre (spinning + weaving + auxiliaries)
    energy_intensity_provenance: EXTERNAL_PENDING
    source_energy: "BEE India textile PAT data 2019; TERI 2020 textile energy audit"
    note: "India textile: spinning 40% energy, processing/dyeing 55%, weaving 5%"

    # CO2 accounting
    co2_coal_t_per_gj: 0.0942     # tCO2/GJ coal (bituminous average)
    co2_coal_provenance: FROZEN_EXTERNAL
    source_co2_coal: "IPCC 2006 Table 1.4; bituminous coal 94.6 kgCO2/GJ"

    pli_eligible: false
    green_premium_eligible: false

  Gas-Transition:
    label: "Natural Gas Boiler"
    description: "Gas-fired steam boilers replacing coal — cleaner transition technology"
    existing_mt: 0.8
    capex_usd_per_t: 140
    capex_provenance: EXTERNAL_PENDING
    source_capex: "GAIL industrial heat cost 2023; gas boiler capex estimates"
    fom_usd_per_t_yr: 20
    vom_residual_usd_per_t: 45
    availability: 0.92
    lifetime_yr: 20
    start_year: 2024
    lead_years: 1
    wacc_premium: 0.0
    max_ramp_mt_yr: 0.5
    fossil_decline: true              # Monotonic: gas production can only stay flat or fall

    gas_gj_per_t: 14.5            # Lower than coal (gas boilers more efficient)
    elec_kwh_per_t: 2700
    energy_intensity_provenance: EXTERNAL_PENDING
    source_energy: "IEA 2023 industrial heat sector; gas boiler efficiency 85-90%"

    co2_gas_t_per_gj: 0.0561      # IPCC 2006 natural gas EF
    co2_gas_provenance: FROZEN_EXTERNAL
    source_co2_gas: "IPCC 2006 Table 1.4; NG 56.1 kgCO2/GJ"

    pli_eligible: false
    green_premium_eligible: false

  Biomass-Cogen:
    label: "Biomass Cogeneration"
    description: "Biomass/agri-residue boilers with cogeneration — near-zero Scope 1 CO2"
    existing_mt: 0.3
    capex_usd_per_t: 200
    capex_provenance: EXTERNAL_PENDING
    source_capex: "MNRE biomass cogeneration programme data; typical cluster cost"
    fom_usd_per_t_yr: 28
    vom_residual_usd_per_t: 55
    availability: 0.85
    lifetime_yr: 20
    start_year: 2024
    lead_years: 2
    wacc_premium: 0.005
    max_ramp_mt_yr: 0.7            # Raised 0.4→0.7: Biomass-Cogen was ramp-constrained every period

    biomass_gj_per_t: 18.0        # Higher GJ/t due to lower efficiency of biomass boilers
    elec_kwh_per_t: 2700
    energy_intensity_provenance: EXTERNAL_PENDING
    source_energy: "TERI 2020; biomass boiler efficiency 70-78% vs coal 80-85%"

    co2_biomass_factor: 0.0       # Biogenic CO2 = zero (lifecycle; residue from agriculture)
    co2_provenance: FROZEN_EXTERNAL
    source_co2: "IPCC Guidelines: agricultural residue CO2 = biogenic (lifecycle accounting)"

    biomass_supply_constrained: true

    pli_eligible: false
    green_premium_eligible: true

  RE-Electrified:
    label: "RE + Electric Heat"
    description: "RE electricity powering electric boilers/heat pumps + spinning"
    existing_mt: 0.1
    capex_usd_per_t: 350          # Higher due to electric boiler + heat pump capex
    capex_provenance: EXTERNAL_PENDING
    source_capex: "IEA 2023 industrial heat decarbonisation; EU textile RE case studies"
    fom_usd_per_t_yr: 35
    vom_residual_usd_per_t: 50
    availability: 0.90
    lifetime_yr: 20
    start_year: 2026
    lead_years: 2
    wacc_premium: 0.005
    max_ramp_mt_yr: 1.0            # Raised 0.5→1.0: RE deployment at India scale; ramp was binding every period

    elec_kwh_per_t: 6500          # Higher kWh/t (all heat from electricity, less fuel)
    elec_is_re: true              # Uses RE price, not grid price
    energy_intensity_provenance: EXTERNAL_PENDING
    source_energy: "EU JRC 2023 Industrial Electrification; electric steam boiler COP ~0.95"
    note: "Electric boilers: 1 GJ heat from ~1.05 GJ electric. Coal equiv 16 GJ → ~17 MWh elec"

    pli_eligible: true
    green_premium_eligible: true

  Green-H2-Steam:
    label: "Green H2 Industrial Steam"
    description: "Hydrogen combustion for high-temperature steam — addresses steam quality gap"
    existing_mt: 0.0
    capex_usd_per_t: 450          # H2 burner retrofit + H2 storage + safety systems
    capex_provenance: PROJECT_PROPOSAL
    source_capex: "Hydrogen Europe 2023 industrial heat; limited textile-specific data"
    fom_usd_per_t_yr: 45
    vom_residual_usd_per_t: 60
    availability: 0.88
    lifetime_yr: 20
    start_year: 2030
    lead_years: 3
    wacc_premium: 0.015
    max_ramp_mt_yr: 0.5            # Raised 0.3→0.5: Green-H2-Steam was ramp-constrained every period

    h2_kg_per_t: 280              # kg H2 per t fibre (steam replacement for coal)
    h2_provenance: EXTERNAL_PENDING
    source_h2: "Derived from coal GJ/t equivalent × HHV H2=142 MJ/kg; ~16 GJ / 57.2 MJ/kg = 280 kg"

    elec_kwh_per_t: 2800
    pli_eligible: true
    green_premium_eligible: true

  Circular-Fibre:
    label: "Recycled Fibre (Circular)"
    description: "Mechanically recycled cotton + chemically recycled polyester"
    existing_mt: 0.2              # Growing slowly
    capex_usd_per_t: 280
    capex_provenance: EXTERNAL_PENDING
    source_capex: "Renewlane/Carbios 2023 chemical recycling costs; EU textile recycling"
    fom_usd_per_t_yr: 30
    vom_residual_usd_per_t: 70    # Higher VOM: sorting + chemical processing
    availability: 0.88
    lifetime_yr: 20
    start_year: 2024
    lead_years: 2
    wacc_premium: 0.01
    max_ramp_mt_yr: 0.4            # Raised 0.3→0.4: modest increase; recycled fibre supply-constrained anyway

    elec_kwh_per_t: 3200          # Chemical recycling more electricity intensive
    energy_intensity_provenance: EXTERNAL_PENDING
    source_energy: "Carbios 2022 lifecycle data; Renewlane 2023"

    # CO2 from recycled fibre: >60% less than virgin polyester
    # No coal use; electricity-driven
    recycled_content_fraction: 0.85  # Fraction from waste inputs
    recycled_supply_constrained: true

    pli_eligible: true
    green_premium_eligible: true

# ── Biomass supply constraint ─────────────────────────────────────────────────
biomass_supply:
  enabled: true
  description: "Agri-residue available for textile sector (Mt/yr dry matter)"
  source: "MNRE 2023 Biomass Atlas; shared with fertiliser, power sectors"
  textile_share_gj_yr:
    CPS: {2024: 800, 2040: 700, 2070: 500}
    NZS: {2024: 800, 2040: 900, 2070: 1000}

# ── Recycled fibre supply ─────────────────────────────────────────────────────
recycled_supply:
  enabled: true
  description: "Post-consumer textile waste available for recycling (Mt/yr)"
  source: "DPIIT 2023; EU Ecodesign Regulation impact study 2022"
  note: "EoL textile lag: ~3-5yr for fast fashion; 15yr+ for denim/workwear"
  available_mt:
    CPS: {2024: 0.3, 2030: 0.6, 2040: 1.2, 2050: 2.0, 2060: 3.0, 2070: 4.0}
    NZS: {2024: 0.3, 2030: 0.9, 2040: 2.0, 2050: 3.5, 2060: 5.5, 2070: 8.0}
  recycling_yield: 0.65           # Fraction of input waste that becomes usable fibre

