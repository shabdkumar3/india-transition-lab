# ── Demand ────────────────────────────────────────────────────────────────────
# Production in Mt fibre equivalent/yr
# India: 2024 ~9.5 Mt fibre; growing with GDP + population + export market

demand:
  unit: "Mt fibre equivalent/yr"
  default_trajectory: model_fitted

demand_trajectories:
  niti:
    label: "NITI Aayog Vol.4 Reference"
    source: "NITI Aayog 2023 India Energy Transition Vol.4"
    method: "Sector production trajectory"
    anchors:
      2024: 9.5
      2030: 12.0
      2040: 16.0
      2050: 20.0
      2060: 24.0
      2070: 28.0

  model_fitted:
    label: "Income Elasticity Model"
    source: "FAO/OECD World Fibre Outlook; India fibre consumption data 1980-2023"
    method: "GDP-elasticity (0.6) fitted to historical; saturation at 20kg/capita"
    assumption: "India per-capita fibre converges to global 12 kg/capita by 2060"
    anchors:
      2024: 9.5
      2030: 11.5
      2040: 15.0
      2050: 19.0
      2060: 22.5
      2070: 25.0

  export_driven:
    label: "Export-Led Growth"
    source: "Textile Ministry Vision 2030; PM MITRA scheme targets"
    method: "Sectoral export target buildup"
    assumption: "India captures 10% global textile trade by 2030 from current 5%"
    anchors:
      2024: 9.5
      2030: 14.0
      2040: 19.0
      2050: 24.0
      2060: 28.0
      2070: 32.0

  circular_economy:
    label: "Circular Economy"
    source: "Ellen MacArthur Foundation 2017; EU Ecodesign 2023"
    method: "Circular fibre reduces primary fibre demand growth"
    assumption: "50% recycled content by 2050 reduces primary demand"
    anchors:
      2024: 9.5
      2030: 11.0
      2040: 13.5
      2050: 15.5
      2060: 17.5
      2070: 19.0

