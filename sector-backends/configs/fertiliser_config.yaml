# ── Demand (Mt NH3/yr — convert to nutrient N for policy) ────────────────────
# India urea production ~30 Mt/yr → ~13.7 Mt NH3 via urea; DAP/MOP also produced
# Total NH3 demand 2024 ~13 Mt; long-term driven by food security

demand:
  unit: "Mt NH3/yr"
  note: "Convert to nutrient N: N = NH3 × 0.823 (14/17 mass fraction)"
  n_fraction_nh3: 0.823  # FROZEN_EXTERNAL (14/17)

demand_trajectories:
  # All anchors in Mt NH3/yr. Frontend shows Mt urea; convert: Mt NH3 = Mt urea × 0.567
  # Base 2024: 30.5 Mt urea × 0.567 = 17.3 Mt NH3 (corrected from prior 13.0 which undercounted)

  niti:
    label: "NITI Aayog Vol.4"
    source: "NITI Aayog (2026) Sectoral Insights: Industry Vol.4 Ch.3.5"
    method: "Piecewise: 30.5 Mt urea (2024) → 55 Mt (2050) → 70 Mt (2070); converted to Mt NH3 × 0.567"
    anchors:
      2024: 17.3
      2050: 31.2
      2070: 39.7

  model_fitted:
    label: "Historical trend"
    source: "FAI production data 2000-2024; CAGR extrapolation with deceleration"
    method: "2.1% CAGR slowing to 1.0%; consistent with frontend model_fitted (Mt urea × 0.567)"
    assumption: "India approaches crop-production saturation; NUE improves moderately"
    anchors:
      2024: 17.3
      2030: 19.7
      2035: 21.9
      2040: 24.0
      2050: 28.4
      2060: 31.8
      2070: 34.0

  india_policy:
    label: "India Policy Consensus"
    source: "NBS Scheme (DoF); Nano-Urea PLI; food-security targets"
    method: "3.5% CAGR slowing to 1.5%; consistent with frontend india_policy (Mt urea × 0.567)"
    anchors:
      2024: 17.3
      2030: 20.7
      2035: 23.8
      2040: 26.6
      2050: 30.6
      2060: 32.9
      2070: 34.0

  international:
    label: "International Baseline"
    source: "IFA World Fertiliser Outlook 2023; FAO AGLINK-COSIMO"
    method: "Conservative: efficiency gains + precision agriculture moderate demand growth (Mt urea × 0.567)"
    anchors:
      2024: 17.3
      2030: 19.3
      2035: 21.3
      2040: 23.0
      2050: 25.2
      2060: 26.5
      2070: 27.2

  high_agriculture:
    label: "High Agriculture"
    source: "ICRISAT crop production projection; climate adaptation scenario"
    method: "Crop intensification + area expansion; same as NITI scale"
    anchors:
      2024: 17.3
      2030: 20.7
      2040: 27.0
      2050: 33.5
      2060: 36.0
      2070: 38.0

  efficiency_nue:
    label: "High Nutrient Use Efficiency"
    source: "IFPRI 2019 NUE scenarios; precision agriculture"
    method: "Improved NUE from 35% → 60% by 2050 reduces fertiliser intensity per crop"
    anchors:
      2024: 17.3
      2030: 18.8
      2040: 20.5
      2050: 22.0
      2060: 22.5
      2070: 23.0

