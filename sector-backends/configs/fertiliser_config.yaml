# Fertiliser Transition Sector — Parameter Registry
# India Transition Lab | Provenance-tagged scientific parameters
#
# KEY SCIENCE:
#   India fertiliser: ~12 Mt N/yr from ammonia synthesis (Haber-Bosch, N2+3H2→2NH3)
#   H2 feedstock intensity: 179.4 kg H2 per tonne NH3 (FROZEN_EXTERNAL — stoichiometry)
#   Net CO2 accounting: CO2 sequestered in urea = 0.733 tCO2/t urea (FROZEN_EXTERNAL)
#   Routes by H2 source: Steam Methane Reforming (SMR), Coal Gasification, Green H2
#   SMR CO2 intensity: ~1.6-1.8 tCO2/t NH3 (process); +0.3 combustion
#   Coal gasif.: ~2.3-2.8 tCO2/t NH3 (much higher due to coal's C:H ratio)
#   Green H2: <0.05 tCO2/t NH3 (only electricity and N2 separation)
#
# PROVENANCE TAGS:
#   FROZEN_EXTERNAL    — Immutable chemical constant
#   EXTERNAL           — Published official source
#   EXTERNAL_PENDING   — Placeholder; source identified
#   PROJECT_PROPOSAL   — Internal modelling assumption

horizon:
  start_year: 2024
  end_year: 2070

port: 8004

discount_rate:
  value: 0.10
  provenance: PROJECT_PROPOSAL
  source: "MoF India infrastructure WACC 9-12% range"

# ── Chemical constants ────────────────────────────────────────────────────────
chemistry:
  h2_per_t_nh3_kg: 179.4
  provenance_h2: FROZEN_EXTERNAL
  source_h2: "Haber-Bosch: N2 + 3H2 → 2NH3; MW NH3=17, H2=2; 3×2/17=0.353 mass fraction → 1/0.353=2.833... wait: 6/17 = 0.353 → 179.4 g H2 per mol×kg scaling"
  note_h2: "Exact: 3 mol H2 (6 g) per mol NH3 (17 g) → 6/17 = 0.353 kg H2/kg NH3 × 1000 = 353 kg H2/t NH3 — corrected below"
  h2_per_t_nh3_kg_corrected: 353.0   # FROZEN_EXTERNAL — 3×2/17 × 1000 = 352.9 kg/t
  co2_sequestered_in_urea_tco2_per_t_urea: 0.733
  provenance_co2_urea: FROZEN_EXTERNAL
  source_co2_urea: "Urea synthesis: CO2 + 2NH3 → (NH2)2CO + H2O; CO2 MW=44, Urea MW=60; 44/60=0.733 tCO2/t urea"
  nh3_per_t_urea: 0.567             # t NH3 per t urea (MW: 2×17/60 = 0.567)
  provenance_nh3_urea: FROZEN_EXTERNAL
  source_nh3_urea: "2NH3 → Urea; 2×17/60 = 0.567 kg NH3/kg urea"
  n_content_urea: 0.467             # N content of urea (46.7%)
  n_content_dap: 0.18               # N content of DAP
  n_content_an: 0.35                # N content of ammonium nitrate

# ── Routes ────────────────────────────────────────────────────────────────────
# Production modelled in Mt NH3/yr (then converted to nutrient N for demand)
# India uses primarily urea (>60% of N fertilisers)

routes:
  NG-SMR:
    label: "Natural Gas SMR"
    description: "Steam methane reforming — current best practice for ammonia"
    existing_mt_nh3: 10.5         # Mt NH3/yr; ~60% of India urea capacity × 0.567 NH3/urea = 18.3 Mt urea → 10.4 Mt NH3
    capex_usd_per_t_nh3: 650      # USD/t NH3/yr (greenfield SMR ammonia plant)
    capex_provenance: EXTERNAL
    source_capex: "IEA 2022 Global Hydrogen Review Appendix; IRENA 2022 Green Hydrogen Cost"
    fom_usd_per_t_yr: 65
    vom_residual_usd_per_t: 30
    availability: 0.92
    lifetime_yr: 25
    start_year: 2024
    lead_years: 3
    wacc_premium: 0.0
    max_ramp_mt_yr: 0.8            # India can add ~1-2 Mt urea/yr → 0.57-1.13 Mt NH3/yr; conservative 0.8
    fossil_decline: false

    # Gas intensity: GJ natural gas per t NH3
    gas_gj_per_t_nh3: 32.5        # GJ/t NH3 — LHV basis (IEA best practice 28-33)
    gas_provenance: EXTERNAL
    source_gas: "IEA 2022 Global Hydrogen Review Table A1; IEA Ammonia Technology Roadmap 2021"

    # Process CO2: from SMR reaction (scope 1)
    process_co2_t_per_t_nh3: 1.65  # tCO2/t NH3 from SMR chemistry
    process_co2_provenance: EXTERNAL
    source_process_co2: "IEA Ammonia Technology Roadmap 2021 Table 2; SMR process CO2 1.5-1.8 range"

    # Combustion CO2: from heating SMR reformer
    combustion_co2_t_per_t_nh3: 0.25  # tCO2/t NH3 from firing
    combustion_co2_provenance: EXTERNAL
    source_combustion_co2: "IEA 2022; total SMR CO2 ~1.9 t/t NH3; split per IEA Roadmap"

    # Electricity intensity
    elec_kwh_per_t_nh3: 150       # kWh/t NH3 (air separation unit, compression)
    elec_provenance: EXTERNAL
    source_elec: "IEA 2021 Ammonia Roadmap; electric auxiliary ~120-200 kWh/t"

    # CCUS retrofit possible — but this route (NG-SMR) has NO CCS installed.
    # CCS potential is modelled via the separate NG-SMR-CCS route.
    ccus_capable: true
    # ccus_capture_rate NOT applied here — NG-SMR has no CCS; see NG-SMR-CCS route.
    ccus_capex_retrofit_usd_per_t: 80   # Reference CAPEX for CCS retrofit if fitted

    pli_eligible: false
    green_premium_eligible: false

  Coal-Gasif:
    label: "Coal Gasification"
    description: "Partial oxidation of coal to syngas — dominant in India's older plants"
    existing_mt_nh3: 6.5          # Mt NH3/yr; ~38% of India urea capacity = 11.6 Mt urea → 6.6 Mt NH3
    capex_usd_per_t_nh3: 900      # USD/t NH3/yr (coal gasif much more capital intensive)
    capex_provenance: EXTERNAL
    source_capex: "IEA 2022; Chinese coal-to-ammonia reference $800-1000/t"
    fom_usd_per_t_yr: 90
    vom_residual_usd_per_t: 40
    availability: 0.88
    lifetime_yr: 25
    start_year: 2024
    lead_years: 4
    wacc_premium: 0.0
    max_ramp_mt_yr: 0.0           # No new coal gasif; retire existing
    cutoff_year_cps: 2030
    cutoff_year_nzs: 2028
    fossil_decline: true

    # Coal intensity: t coal per t NH3
    coal_t_per_t_nh3: 1.45       # t sub-bituminous coal per t NH3
    coal_provenance: EXTERNAL
    source_coal: "IEA 2022; China Yuntianhua coal-to-ammonia plant data; typical range 1.3-1.6"

    # CO2 from gasification (process + combustion, harder to separate)
    total_co2_t_per_t_nh3: 2.90  # tCO2/t NH3 (much higher due to coal C:H ratio)
    co2_provenance: EXTERNAL
    source_co2: "IEA 2022 Appendix; coal gasif 2.5-3.2 tCO2/t NH3 range"

    elec_kwh_per_t_nh3: 200
    ccus_capable: true
    # ccus_capture_rate NOT applied here — Coal-Gasif existing plants have no CCS;
    # this route represents coal gasification WITHOUT carbon capture.
    ccus_capex_retrofit_usd_per_t: 120

    pli_eligible: false
    green_premium_eligible: false

  NG-SMR-CCS:
    label: "SMR with Carbon Capture"
    description: "Blue ammonia — SMR process + CCUS capturing >90% process CO2"
    existing_mt_nh3: 0.0
    capex_usd_per_t_nh3: 780      # USD/t NH3/yr (SMR capex + CCS)
    capex_provenance: PROJECT_PROPOSAL
    source_capex: "IEA 2022 Appendix; $650 SMR + ~$130 CCS premium"
    fom_usd_per_t_yr: 80
    vom_residual_usd_per_t: 40
    availability: 0.90
    lifetime_yr: 25
    start_year: 2028
    lead_years: 4
    wacc_premium: 0.005
    max_ramp_mt_yr: 0.6            # CCS on top of SMR; slightly tighter than base SMR

    gas_gj_per_t_nh3: 33.5       # Slightly higher gas due to CCS energy penalty
    # GROSS process CO2 = same as NG-SMR (1.65 tCO2/t NH3); code applies ccus_capture_rate
    # Net residual after 90% capture = 1.65 × (1-0.90) = 0.165 tCO2/t NH3
    process_co2_t_per_t_nh3: 1.65  # GROSS tCO2/t NH3; CCS capture applied via ccus_capture_rate
    combustion_co2_t_per_t_nh3: 0.25  # Combustion CO2 not captured (heat)
    ccus_capture_rate: 0.90           # Applied to process_co2 only; combustion not captured
    elec_kwh_per_t_nh3: 200

    pli_eligible: false
    green_premium_eligible: true  # "Blue ammonia" commands green premium

  Green-H2:
    label: "Green Hydrogen Ammonia"
    description: "Electrolysis H2 + Haber-Bosch; near-zero process CO2"
    existing_mt_nh3: 0.02         # Pilot plants only
    capex_usd_per_t_nh3: 1600     # USD/t NH3/yr (electrolyser + HB plant)
    capex_provenance: PROJECT_PROPOSAL
    source_capex: "IRENA 2022 Green Hydrogen Cost Review; Haldor Topsoe 2023"
    fom_usd_per_t_yr: 150
    vom_residual_usd_per_t: 50
    availability: 0.85
    lifetime_yr: 20
    start_year: 2027
    lead_years: 3
    wacc_premium: 0.02
    max_ramp_mt_yr: 0.8            # Align with NG-SMR ramp; electrolyser supply chain

    # Green H2: intensive electricity use instead of gas
    elec_kwh_per_t_nh3: 10500    # kWh/t NH3 = 353 kgH2 × 55 kWh/kgH2 + ASU + HB compression
    elec_provenance: EXTERNAL
    source_elec: "IRENA 2022: 55 kWh/kgH2 alkaline × 176.5 kgH2/t NH3 = 9.7 MWh + HB ~0.8 MWh → ~10.5 MWh/t"

    process_co2_t_per_t_nh3: 0.0  # No carbon feedstock
    combustion_co2_t_per_t_nh3: 0.0
    total_co2_t_per_t_nh3: 0.0
    elec_ei_override: null        # Uses grid EI trajectory (RE-powered ideally)
    re_powered: true              # Flag for RE electricity cost use

    pli_eligible: true
    green_premium_eligible: true

  Biomass-Reform:
    label: "Biomass Reforming"
    description: "Reforming agricultural residue to syngas for NH3 synthesis"
    existing_mt_nh3: 0.0
    capex_usd_per_t_nh3: 1100
    capex_provenance: EXTERNAL_PENDING
    source_capex: "Limited commercial scale; estimate based on biomass gasification + HB"
    fom_usd_per_t_yr: 110
    vom_residual_usd_per_t: 60
    availability: 0.80
    lifetime_yr: 20
    start_year: 2030
    lead_years: 3
    wacc_premium: 0.015
    max_ramp_mt_yr: 0.3

    biomass_gj_per_t_nh3: 38.0   # GJ biomass per t NH3 (lower efficiency than NG)
    biomass_provenance: EXTERNAL_PENDING
    source_biomass: "IRENA 2012 Biomass for Power Generation; limited NH3 plant data"

    process_co2_t_per_t_nh3: 0.15  # Near-biogenic; residual non-captured fraction
    combustion_co2_t_per_t_nh3: 0.0  # Biomass combustion CO2 counted as zero (biogenic)
    elec_kwh_per_t_nh3: 180

    biomass_supply_constrained: true  # Like scrap, biomass is physically limited

    pli_eligible: true
    green_premium_eligible: true

