# ── Demand trajectories ───────────────────────────────────────────────────────
# India aluminium demand: structural (construction, infrastructure) + consumer
# Historical: 2024 ~5.0 Mt; growth driven by EVs, solar panels, packaging
# Key policy: PLI scheme for Advanced Chemistry Cells → EV Al demand surge

demand:
  default_scenario: model_fitted

demand_trajectories:
  niti:
    label: "NITI Aayog Vol.4 Reference"
    source: "NITI Aayog 2023 India Energy Transition Outlook Vol.4"
    method: "Sector-specific forecast"
    anchors:
      2024: 5.0
      2030: 7.5
      2040: 11.0
      2050: 16.0
      2060: 21.0
      2070: 26.0

  model_fitted:
    label: "Logistic S-curve (fitted to historical)"
    source: "World Aluminium / IAI historical production data; logistic fit"
    method: "Logistic S-curve: GDP per capita elasticity + saturation"
    assumption: "Saturation at 35 Mt/yr (comparable to China 2024 per-capita × India 2070 pop)"
    anchors:
      2024: 5.0
      2030: 7.0
      2040: 11.5
      2050: 17.5
      2060: 24.0
      2070: 30.0

  india_policy:
    label: "India Policy Consensus (NAMP + PLI)"
    source: "Ministry of Mines (2021). National Aluminium Mission. MoCI (2021). PLI Scheme for EV/packaging."
    method: "60% National Aluminium Mission capacity targets + 40% PLI-driven EV/packaging demand"
    assumption: "India meets PLI targets for EV batteries and aluminium packaging; domestic production replaces imports."
    anchors:
      2024: 4.5
      2030: 8.5
      2035: 12.0
      2040: 15.5
      2050: 20.0
      2060: 22.5
      2070: 24.0

  international:
    label: "International Baseline (IEA Aluminium Roadmap + World Aluminium STEPS)"
    source: "IEA (2022). Aluminium Technology Roadmap. World Aluminium (2023). Statistical Compendium."
    method: "60% IEA STEPS India trajectory + 40% World Aluminium demand forecast. Service-led economy."
    assumption: "Moderate EV adoption, recycling rates improve. ~12 kg/cap by 2070 (service economy path)."
    anchors:
      2024: 4.5
      2030: 6.5
      2035: 9.0
      2040: 11.5
      2050: 15.5
      2060: 18.0
      2070: 20.0

  high_ev:
    label: "High EV + RE Scenario"
    source: "IEA 2023 India EV Outlook; NITI Aayog EV30@30 scenario"
    method: "Sectoral demand build-up: EV + solar panels + packaging surge"
    assumption: "EV fleet 30% by 2030, 80% by 2040 → Al-intensive battery/body demand"
    anchors:
      2024: 5.0
      2030: 8.5
      2040: 14.5
      2050: 21.0
      2060: 27.0
      2070: 33.0

  efficiency_driven:
    label: "Efficiency + Material Substitution"
    source: "Material efficiency literature; UNEP 2011 recycling potential"
    method: "Lower demand from lightweighting, recycling, substitution"
    assumption: "Recycling rate doubles to 50% by 2040; design for recycling mandated"
    anchors:
      2024: 5.0
      2030: 6.5
      2040: 9.5
      2050: 13.0
      2060: 17.0
      2070: 21.0

