policy:
  pli_usd_per_t:
    description: "PLI incentive for green aluminium (low-carbon routes)"
    RE-Primary:
      CPS: {2024: 0, 2030: 20, 2040: 15, 2050: 10, 2060: 0, 2070: 0}
      NZS: {2024: 0, 2030: 30, 2040: 20, 2050: 15, 2060: 5, 2070: 0}
    Inert-Anode:
      CPS: {2024: 0, 2030: 40, 2040: 30, 2050: 20, 2060: 10, 2070: 0}
      NZS: {2024: 0, 2030: 60, 2040: 45, 2050: 30, 2060: 15, 2070: 0}
    source: PROJECT_PROPOSAL

  green_premium_usd_per_t:
