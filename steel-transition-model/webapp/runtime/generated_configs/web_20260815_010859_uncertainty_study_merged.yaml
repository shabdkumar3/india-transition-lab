dynamic_scrap:
  enabled: false
  provenance: PROJECT_PROPOSAL
  historical_cohorts:
    unit: Mt
    start_year: 1990
    end_year: 2023
    provenance: EXTERNAL
    source: Ministry of Steel Annual Report 2025-26 (JPC production series)
    source_page: Table 3.2.2 / production summary
    production_mt:
      2021:
        value: 103.545
        provenance: EXTERNAL
        source: MoS AR 2025-26 (FY2020-21 crude steel production)
        notes: FY2020-21 attributed to calendar 2021 (fiscal-year-end convention)
      2022:
        value: 120.293
        provenance: EXTERNAL
        source: MoS AR 2025-26 (FY2021-22 crude steel production)
        notes: FY2021-22 attributed to calendar 2022 (fiscal-year-end convention)
  lifetime:
    distribution: weibull
    weibull_shape: 2.5
    weibull_scale: 20.0
    deterministic_lifetime_years: 20
    provenance: PROJECT_PROPOSAL
    notes: Weibull(2.5, 20) per ASSUMPTION_DEBT_REGISTER.md; parametric scenario variable
      for sensitivity.
  collection:
    collection_rate:
      value: 0.8
      provenance: PROJECT_PROPOSAL
      notes: Parametric scenario variable; empirical Indian series DEFERRED.
    processing_yield:
      value: 0.9
      provenance: PROJECT_PROPOSAL
      notes: Parametric scenario variable; empirical Indian series DEFERRED.
  scrap_imports:
    value: 0.0
    provenance: EXTERNAL_PENDING
    notes: Imports excluded from this version (ScrapUse_t <= UsableDomesticScrap_t).
      Pathway reserved.
provenance_gating:
  policy: strict
  allow_proposal_parameters: true
  pending_intensity_allowances:
  - BF-BOF/iron_ore
  - BF-BOF/coking_coal
  - NG-DRI-EAF/iron_ore
  - Scrap-EAF/scrap
  intensity_overrides:
  - route: Scrap-EAF
    resource: scrap
    value: 1.15
    provenance: EXTERNAL_PENDING
    rationale: UNCERTAINTY-BOUNDED PATHWAY SCENARIO 'SCRAP_HIGH' = 1.15 t/t (source-supported
      scenario bound; NOT a frozen value. 1.08 is diagnostic-only; 92.5% yield not
      source-backed; worldsteel 0.88/0.71 are the BLENDED route, boundary mismatch).
  - route: Coal-DRI-IF
    resource: non_coking_coal
    value: 0.6
    provenance: EXTERNAL_PENDING
    rationale: UNCERTAINTY-BOUNDED PATHWAY SCENARIO 'DRI_IBM' charge 0.4 t DRI/t steel
      x CEEW coal 1.5 t/t DRI (midpoint of source-supported 1.4-1.6). Scenario construction,
      NOT frozen (IBM vs CEEW conflict unresolved).
  - route: Coal-DRI-IF
    resource: iron_ore
    value: 0.6
    provenance: EXTERNAL_PENDING
    rationale: UNCERTAINTY-BOUNDED PATHWAY SCENARIO 'DRI_IBM' charge 0.4 t DRI/t steel
      x CEEW ore 1.5 t/t DRI (midpoint of source-supported 1.4-1.6). Scenario construction,
      NOT frozen.
