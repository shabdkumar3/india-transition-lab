      2024: 2
      2030: 10
      2040: 30
      2050: 75
      2060: 100
      2070: 130
    NZS:
      2024: 5
      2030: 30
      2040: 80
      2050: 140
      2060: 175
      2070: 200
h2_supply_cap:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'India National Green Hydrogen Mission (NGHM, 2023) targets 5 MMTPA green
    H2 by 2030; steel sector can absorb at most ~30-40% of this. Intensities: H2-DRI-EAF
    ~55 kg H2/t steel = 0.055 t H2/t steel. Cap here is in Mt H2/yr consumed by steel
    sector.

    '
  anchor_years_mt:
    2024: 0.001
    2030: 0.3
    2035: 1.0
    2040: 3.0
    2050: 8.0
    2060: 15.0
    2070: 22.0
stranded_asset_cost:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'Fraction of annualised CAPEX that represents stranded value on early retirement.
    0.30 means 30% of annual CAPEX is "lost" per Mt retired before lifetime. This
    discourages economically unjustified premature retirement. Based on IEA asset-stranding
    cost literature (indicative).

    '
  stranded_cost_fraction: 0.3
