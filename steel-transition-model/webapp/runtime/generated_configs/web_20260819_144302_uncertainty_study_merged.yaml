  qualifying_routes:
  - H2-DRI-EAF
  - Scrap-EAF
  premium_usd_per_t:
    2024: 0.0
    2030: 8.0
    2035: 18.0
    2040: 32.0
    2050: 48.0
    2060: 58.0
    2070: 65.0
