      2050: 355.0
      2060: 385.0
      2070: 400.0
grid_emission_intensity:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'India grid average emission factor from CEA CO2 baseline 2022-23 (716 gCO2/kWh).
