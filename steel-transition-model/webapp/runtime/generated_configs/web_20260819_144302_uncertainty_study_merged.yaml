    2030: 0.54
    2040: 0.33
    2050: 0.18
    2060: 0.09
    2070: 0.04
construction_lead_time:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'Technology-specific construction and commissioning lag. Sources: IEA WEO
    2023 investment timing annex; ISPATGURU plant timelines. H2-DRI-EAF lead includes
    electrolyser + H2 storage installation. EAF/Scrap-EAF shortest (modular, established
    supply chain).

    '
  lead_time_years:
    BF-BOF: 3
    Coal-DRI-EAF: 2
    Coal-DRI-IF: 2
    NG-DRI-EAF: 2
    H2-DRI-EAF: 3
    Scrap-EAF: 1
wacc_premium:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'Risk premium reflecting differential financing cost for nascent vs mature
    technologies in India''s capital markets. Based on IEA WEO 2023 financing cost
    analysis (developing economies, coal vs green technology). BF-BOF and Coal-DRI
    are mature (no premium); H2-DRI faces higher perceived risk.

    '
  premium_by_route:
    BF-BOF: 1.0
    Coal-DRI-EAF: 1.08
    Coal-DRI-IF: 1.05
    NG-DRI-EAF: 1.05
    H2-DRI-EAF: 1.25
    Scrap-EAF: 1.0
policy_incentives:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'India Green Steel PLI-equivalent subsidy schedule (indicative). H2-DRI-EAF:
    front-loaded (heavy subsidy 2030-2040, tapers as technology matures). Scrap-EAF:
    smaller steady subsidy (scrap collection infrastructure support). Sources: SAIL/MoS
    Green Steel Mission announcements; IEA CCUS for Steel 2023.

    '
  incentives_usd_per_t:
    H2-DRI-EAF:
      2030: -20.0
      2035: -15.0
      2040: -10.0
      2045: -5.0
      2050: 0.0
    Scrap-EAF:
      2024: -4.0
      2030: -3.0
      2040: -2.0
      2050: -1.0
      2060: 0.0
green_steel_premium:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'Green-steel market premium for low-emission steel production. Threshold:
    routes with process+combustion tCO2/t < 0.5 qualify. Growing demand from EU CBAM
    (effective 2026), automotive OEMs (BMW/VW green procurement), and India''s own
    green procurement policy. Sources: Hatch/KPMG Green Steel Market Report 2023;
    Wood Mackenzie 2023.

    '
