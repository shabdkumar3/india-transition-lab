    start_year: 1990
    end_year: 2023
    provenance: EXTERNAL
    source: Ministry of Steel Annual Report 2025-26 (JPC production series)
    source_page: Table 3.2.2 / production summary
    production_mt:
      2021:
        value: 103.545
        provenance: EXTERNAL
        source: MoS AR 2025-26 (FY2020-21 crude steel production)
        notes: FY2020-21 attributed to calendar 2021 (fiscal-year-end convention)
      2022:
        value: 120.293
        provenance: EXTERNAL
        source: MoS AR 2025-26 (FY2021-22 crude steel production)
        notes: FY2021-22 attributed to calendar 2022 (fiscal-year-end convention)
  lifetime:
    distribution: weibull
    weibull_shape: 2.5
    weibull_scale: 20.0
    deterministic_lifetime_years: 20
    provenance: PROJECT_PROPOSAL
    notes: Weibull(2.5, 20) per ASSUMPTION_DEBT_REGISTER.md; parametric scenario variable
      for sensitivity.
  collection:
    collection_rate:
      value: 0.8
      provenance: PROJECT_PROPOSAL
      notes: Parametric scenario variable; empirical Indian series DEFERRED.
    processing_yield:
      value: 0.9
      provenance: PROJECT_PROPOSAL
      notes: Parametric scenario variable; empirical Indian series DEFERRED.
  scrap_imports:
    value: 0.0
    provenance: EXTERNAL_PENDING
    notes: Imports excluded from this version (ScrapUse_t <= UsableDomesticScrap_t).
      Pathway reserved.
  historical_scrap_supplement:
    provenance: PROJECT_PROPOSAL
    rationale: 'Estimated usable EOL scrap from 1990-2020 production cohorts (EXTERNAL_PENDING
      in the cohort model). Recalibrated upward from 22 Mt to 30 Mt in 2024 to match
      Vol.4 actual total scrap consumption = 33.36 Mt (p.43, Fig 2.7). The 30 Mt (vs
      33.36 Mt) reflects that the supplement covers EOL + home/process scrap for non-tracked
      pre-2021 cohorts; the 3 Mt gap is covered by 2021-2022 tracked cohort contributions
      from the dynamic scrap engine. With all 6 routes now enabled, the scrap balance
      includes BF-BOF (0.15), Coal-DRI-EAF (0.20), Coal-DRI-IF (0.15), NG-DRI-EAF
      (0.20) secondary charges PLUS Scrap-EAF primary.

      '
    anchor_years_mt:
      2024: 30.0
      2028: 34.0
      2032: 32.0
      2040: 22.0
      2050: 10.0
      2060: 4.0
      2070: 1.0
provenance_gating:
  policy: strict
  allow_proposal_parameters: true
  pending_intensity_allowances:
  - BF-BOF/iron_ore
  - Coal-DRI-EAF/iron_ore
  - Coal-DRI-IF/iron_ore
  - NG-DRI-EAF/iron_ore
  - H2-DRI-EAF/iron_ore
  intensity_overrides:
  - route: Scrap-EAF
    resource: scrap
    value: 1.08
    provenance: PROJECT_PROPOSAL
    rationale: 'IEA Roadmap 2020 / IMC-2021 EAF mass balance: ~1.08 t scrap per t
      liquid steel. Activates the physical scrap cost and enables the Mode B dynamic
      scrap balance to meaningfully constrain Scrap-EAF.

      '
  - route: BF-BOF
    resource: coking_coal
    value: 0.89
    provenance: PROJECT_PROPOSAL
    rationale: 'IEA Roadmap 2020 / WorldSteel BF coal balance: ~0.89 t coking coal
      per t crude steel. Consistent with Mode A baseline.

      '
  - route: Coal-DRI-EAF
    resource: non_coking_coal
    value: 1.2
    provenance: PROJECT_PROPOSAL
    rationale: "Vol.4 Fig 2.8 coal-thermal SEC (22.5 GJ/t) / Indian non-coking coal\
      \ GCV (18.84 GJ/t at 4500 kcal/kg) = 1.195 t/t \u2248 1.2 t/t. Activates dominant\
      \ fuel cost for Coal-DRI-EAF route.\n"
  - route: Coal-DRI-IF
    resource: non_coking_coal
    value: 1.2
    provenance: PROJECT_PROPOSAL
    rationale: "Same rotary kiln process as Coal-DRI-EAF. Vol.4 Fig 2.8 kiln coal\
      \ SEC (22.5 GJ/t) / 18.84 GJ/t = 1.195 \u2248 1.2 t/t. The IF route uses ~70%\
      \ DRI charge in the IF, with the same kiln-based DRI process.\n"
  - route: Scrap-EAF
    resource: scrap
    value: 1.0
    provenance: EXTERNAL_PENDING
    rationale: UNCERTAINTY-BOUNDED PATHWAY SCENARIO 'SCRAP_LOW' = 1.0 t/t (source-supported
      scenario bound; NOT a frozen value. 1.08 is diagnostic-only; 92.5% yield not
      source-backed; worldsteel 0.88/0.71 are the BLENDED route, boundary mismatch).
endogenous_learning:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'Learning rates from IRENA/IEA learning curve literature. H2-DRI-EAF: nascent
    technology, strong learning expected (10% per doubling). Scrap-EAF: mature technology,
    weak learning (5% per doubling).

    '
  tolerance: 0.001
  max_iterations: 25
  routes:
    H2-DRI-EAF:
      learning_rate: 0.1
      initial_cumulative_capacity_mt: 0.5
      learning_scope: full_plant
      provenance: PROJECT_PROPOSAL
    Scrap-EAF:
      learning_rate: 0.05
      initial_cumulative_capacity_mt: 500.0
      learning_scope: full_plant
      provenance: PROJECT_PROPOSAL
carbon_price:
  enabled: true
  provenance: PROJECT_PROPOSAL
  notes: 'India-adapted carbon price trajectories. CPS reflects PAT evolution + CCTS
    pilot (modest). NZS reflects IEA NZE 2050 developing-economy trajectory (140 USD/tCO2
    by 2050). Values are indicative, not official.

    '
