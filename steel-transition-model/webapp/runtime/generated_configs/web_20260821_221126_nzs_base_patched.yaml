provenance_gating:
  policy: strict
  allow_proposal_parameters: true
  intensity_overrides:
  - route: Scrap-EAF
    resource: scrap
    value: 1.08
    provenance: PROJECT_PROPOSAL
    rationale: 'IEA Roadmap 2020 / IMC-2021 EAF mass balance: ~1.08 t scrap per t
      liquid steel. Activates the physical scrap cost and enables the Mode B dynamic
      scrap balance to meaningfully constrain Scrap-EAF.

      '
  - route: BF-BOF
    resource: iron_ore
    value: 1.6
    provenance: EXTERNAL CROSSREF
    rationale: 'WorldSteel Statistical Yearbook 2023 BF mass balance: 1.55-1.65 t
      iron ore per t crude steel; IEA Iron & Steel Technology Roadmap 2020 Table A.1:
      1.60 t/t. Uses standard burden rate assuming sinter/pellet mix (58% Fe) consistent
      with India''s major integrated plants (SAIL, Tata, JSW benchmarks).

      '
  - route: NG-DRI-EAF
    resource: iron_ore
    value: 1.42
    provenance: EXTERNAL CROSSREF
    rationale: 'IEA Iron & Steel Technology Roadmap 2020 Table A.1 shaft-furnace DRI
      mass balance: 1.40-1.44 t iron ore / t crude steel at 94% metallization (Midrex/HYL
      grade). Using 1.42 t/t as central estimate. Pellet grade iron ore (64-67% Fe).

      '
  - route: H2-DRI-EAF
    resource: iron_ore
    value: 1.42
    provenance: EXTERNAL CROSSREF
    rationale: 'Same shaft-furnace DRI process as NG-DRI-EAF (HYFOR/Midrex H2-ready).
      IEA 2020 / MIDREX H2 report: 1.42 t iron ore / t crude steel at 94% metallization.
      No significant difference from NG-DRI in ore consumption per mass-balance.

      '
  - route: Coal-DRI-EAF
    resource: iron_ore
    value: 1.45
    provenance: EXTERNAL CROSSREF
    rationale: 'Rotary kiln DRI (SL/RN process) has slightly lower metallization (~91-93%)
      than shaft furnace, requiring modestly more ore. IEA 2020 / CEEW 2024 estimate:
      1.44-1.47 t/t; using 1.45 t/t as central value for India''s Coal-DRI plants.

      '
  - route: Coal-DRI-IF
    resource: iron_ore
    value: 1.45
    provenance: EXTERNAL CROSSREF
    rationale: 'Same rotary kiln DRI process as Coal-DRI-EAF. Induction furnace melting
      does not change the DRI production mass balance. 1.45 t/t consistent with Vol.4
      Fig 2.8 and India''s sponge iron industry standards (70-80 Mtpa rotary kiln
      fleet).

      '
  - route: BF-BOF
    resource: coking_coal
    value: 0.89
    provenance: PROJECT_PROPOSAL
    rationale: 'IEA Roadmap 2020 / WorldSteel BF coal balance: ~0.89 t coking coal
      per t crude steel. Consistent with Mode A baseline.

      '
  - route: Coal-DRI-EAF
    resource: non_coking_coal
    value: 1.2
    provenance: PROJECT_PROPOSAL
    rationale: "Vol.4 Fig 2.8 coal-thermal SEC (22.5 GJ/t) / Indian non-coking coal\
      \ GCV (18.84 GJ/t at 4500 kcal/kg) = 1.195 t/t \u2248 1.2 t/t. Activates dominant\
      \ fuel cost for Coal-DRI-EAF route.\n"
  - route: Coal-DRI-IF
    resource: non_coking_coal
    value: 1.2
    provenance: PROJECT_PROPOSAL
    rationale: "Same rotary kiln process as Coal-DRI-EAF. Vol.4 Fig 2.8 kiln coal\
      \ SEC (22.5 GJ/t) / 18.84 GJ/t = 1.195 \u2248 1.2 t/t. The IF route uses ~70%\
      \ DRI charge in the IF, with the same kiln-based DRI process.\n"
