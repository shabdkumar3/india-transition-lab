# ============================================================
# EXTERNAL SOURCE MANIFEST — India Steel Transition Model
# Step 6: External Data Acquisition, Normalization & Parameter Freeze
# ============================================================
#
# Every actual source file used MUST be stored under data/external/
# and registered here. The master parameter registry
# (PARAMETER_SOURCE_OF_TRUTH.md) and the machine-readable frozen
# parameter file (data/external/parameters/external_parameters.yaml)
# reference these source_ids.
#
# Metadata fields per section AB of the Step 6 handoff:
#   source_id, filename, publisher, title, year, url/reference,
#   scope, parameters extracted
#
# Source hierarchy per SOURCE_REGISTER.md:
#   LEVEL 3 = authoritative external (IEA, JPC / Ministry of Steel)
#   LEVEL 4 = external technical/economic with explicit citation

sources:

  - source_id: "IEA-ISTR-2020"
    filename: "data/external/iea_iron_steel_technology_roadmap_2020.pdf"
    extracted_text: "data/external/extracted/iea_roadmap_2020.txt"
    publisher: "International Energy Agency (IEA)"
    title: "Iron and Steel Technology Roadmap: Towards more sustainable steelmaking"
    year: 2020
    url: "https://www.iea.org/reports/iron-and-steel-technology-roadmap"
    source_level: "LEVEL 3"
    scope: >
      Global iron and steel technology pathways; route-level CAPEX, fixed OPEX and
      levelised costs; equipment lifetimes and average asset ages; scrap availability;
      energy price ranges; dedicated India chapter (Ch. 3) with route splits.
    parameters_extracted:
      - "CAPEX (annualised, USD/t crude steel) by route — BF-BOF, DRI-EAF, scrap-EAF"
      - "Fixed OPEX (USD/t crude steel, energy and labour excluded) by route"
      - "Energy price ranges: natural gas, thermal coal, coking coal, electricity, scrap, iron ore"
      - "Equipment lifetime assumptions: 25-yr investment cycle; ~40-yr typical technical lifetime"
      - "Electrolyser CAPEX/OPEX (USD/kWe) for H2-DRI"
      - "H2-DRI levelised cost in India (USD/t crude steel)"
      - "India installed capacity split by route (2018): BOF 44%, EAF 29%, IF 27%"
      - "India route production split (2019): electric furnace 56%, BF-BOF 44%"
      - "India scrap consumption (~30 Mt, 2019) and iron ore balance (203 Mt consumption, 2018)"
      - "CO2 transport and storage cost (USD 20/t CO2 captured)"
      - "Average age of ironmaking capacity: ~13 yr BF, ~14 yr DRI"
    notes: >
      CAPEX/OPEX figures are GLOBAL modelling values (8% discount rate, 25-year
      lifetime, 90% capacity factor unless stated), not India-specific plant costs.
      Reported in 2019 USD (World Steel Prices 2020).

  - source_id: "MOS-AR-2025-26"
    filename: "data/external/mos_annual_report_2025_26.pdf"
    extracted_text: "data/external/extracted/mos_ar_2025_26.txt"
    publisher: "Ministry of Steel, Government of India"
    title: "Ministry of Steel Annual Report 2025-26"
    year: 2025
    url: "https://steel.gov.in"
    source_level: "LEVEL 3"
    scope: >
      Indian steel sector official statistics: crude steel capacity, production and
      capacity utilisation 2021-22 to Apr-Dec 2025-26; route-wise production shares
      (BOF/EAF/IF); sponge iron production split (coal vs gas based); finished steel
      consumption; Steel Scrap Recycling Policy 2019; CPSE CAPEX.
    parameters_extracted:
      - "Crude steel capacity (MT) by year — 2024-25: 200.333 (JPC)"
      - "Crude steel production (MT) by year — 2024-25: 152.180 (JPC)"
      - "Route-wise production shares 2024-25: BOF 41.1%, EAF 20.8%, IF 38.2%"
      - "Sponge iron production 2024-25: coal 46.883 Mt, gas 8.880 Mt, total 55.764 Mt"
      - "Coal-based DRI share Apr-Dec 2025-26(P): ~85%"
      - "Finished steel consumption 2024-25: 152.129 Mt"
      - "Steel Scrap Recycling Policy 2019 (existence and objectives)"
      - "ELV scrap recovery: 42,424 vehicles -> 26,072 t ferrous scrap (MMRPL)"
      - "CPSE CAPEX FY 2024-25: Rs 10,653.31 crore"
      - "NSP 2017 targets: 300 Mt capacity / 255 Mt production by 2030-31"
    notes: >
      Route shares are PRODUCTION shares (JPC), not capacity shares. Production and
      capacity are kept as separate records; capacity is never inferred from
      production / PLF.

