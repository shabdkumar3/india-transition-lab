# STATUS: PARTIAL — PHASE 20 FINAL SCIENTIFIC DATA RESOLUTION
# ROUTE TRANSITION INTERPRETABILITY: FALSE (route-level vintages GAP)
#
# Provenance levels:
#   FROZEN_EXTERNAL   — exact source + page + value confirmed
#   FROZEN_DERIVED    — derivation from confirmed source documented
#   PROJECT_PROPOSAL  — working estimate, not confirmed from primary source
#   EXTERNAL_PENDING  — data gap, value absent or unconfirmed
#
# RULE: Do NOT infer capacity from production statistics.
#       Do NOT promote without exact source + page/table.
#
# Primary authoritative sources for plant-level data:
#   MoS Annual Report 2025-26 (available: data/external/mos_annual_report_2025_26.pdf)
#   MoS "Greening the Steel Sector in India: Roadmap and Action Plan" (March 2025) —
#     route-level aggregates FY2023-24 (BF hot-metal 95.8 / EAF 36.61 / IF 68.8 Mt)
#   Rajya Sabha reply 27.03.2026 AU3982 + Lok Sabha Apr-2023 LU 5356 (SAIL per-plant)
#   CAG Report No. 38 of 2025 (SAIL BF capacity 23.07 MTPA / 28 BFs)
#   JSW Steel Integrated Report 2024-25 (JSW total domestic crude capacity 34.2 MTPA)
#   JPC Annual Statistics 2024-25 (GATED — requires portal registration)
#   IEA Iron & Steel Technology Roadmap 2020, Ch.3 (India 2018 route capacity split)
# =============================================================================

