  classification: "CANDIDATE_ENRICHED_PARAMETERIZATION"
  route_transition_interpretability: false
  note: >
    PHASE 20: plant-level entries for SAIL/RINL/Tata/JSPL/NMDC retained as
    FROZEN_EXTERNAL with primary citations; JSW total domestic crude capacity
    34.2 MTPA (JSW Steel Integrated Report 2024-25) ADDED as FROZEN_EXTERNAL
