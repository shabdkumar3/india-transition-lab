# =============================================================================
# DRI CHARGE RATIO AUDIT RECORD  (PHASE 20 — THIRD DATA POINT ADDED)
# =============================================================================
# PRIMARY evidence:
#   IBM Indian Minerals Yearbook 2022 (p.7-3/7-4): IF metallic charge ~40% sponge
#   iron + ~10% cast/pig iron + ~50% steel melting scrap (FY2021-22, 847 IFs,
#   35.21 Mt crude steel). NATIONAL AVERAGE — PRIMARY official source.
#   CEEW 2024 cluster survey (Raipur/Raigarh/Bellary, 30 plants): IF scrap
#   utilisation ~12.5% average => DRI+other ~87.5% (NOT a DRI-only mass balance).
#   Fastmarkets 2023 (market observation): IF DRI share 50-70%, scrap 30-40%,
#   dynamically shifting with DRI/scrap price spreads (sometimes 70-90% DRI).
# CONFLICT: IBM (~50% scrap national avg) vs CEEW (~12.5% scrap clusters) vs
# Fastmarkets (30-40% scrap dynamic). Definitions/samples differ (national
# average vs cluster survey vs market snapshot) -> charge ratio stays
# EXTERNAL_PENDING; preserved as scenario alternatives (DRI_IBM 0.40, DRI_CEEW
# 0.875). Do NOT promote 0.61 or 0.80.
# =============================================================================
dri_charge_ratio:
  IF_route:
    ratio_used_in_candidate: 0.61
    status: "EXTERNAL_PENDING"
    evidence_found: true
    evidence_note: >
      Three conflicting sources: IBM IMYB 2022 (IF charge ~40% DRI + 10%
      pig/cast iron + ~50% scrap, national average), CEEW 2024 (IF scrap ~12.5%
      average, cluster survey), Fastmarkets 2023 (IF DRI 50-70% / scrap 30-40%,
      dynamic market). The three disagree; 0.61 (~39% scrap + 61% DRI+other) is
      NOT confirmed by any source. KEEP: EXTERNAL_PENDING. DO NOT PROMOTE 0.61.

  EAF_route:
    ratio_used_in_candidate: 0.80
    status: "EXTERNAL_PENDING"
    evidence_found: false
    evidence_note: >
      IEA roadmap discusses DRI-EAF charge mix qualitatively but gives no fixed
      percentage for Indian coal-DRI-EAF plants. EAF DRI fractions reported as
      25%–100% depending on grade and scrap availability. No defensible
      EAF-specific charge ratio found in PHASE 20 => Coal-DRI-EAF = DEFERRED
      (special rule: do not borrow IF charge data). KEEP: EXTERNAL_PENDING.
      DO NOT PROMOTE 0.80.
      PHASE 21 NOTE: BigMint FY2025 commercial market data reports IF: 59% DRI /
      37% scrap / 4% HM, and EAF: 37% DRI / 10% scrap / 53% HM. BigMint is a
      commercial price-reporting agency — NOT a primary source (government/peer-
      reviewed). These values are recorded as additional SCENARIO_ALTERNATIVES context
      but are NOT promotable to FROZEN_EXTERNAL under the 10-criteria rule.
      Named scenario alternatives (not frozen):
        DRI_IBM_LOW: 0.40 DRI fraction (IBM IMYB 2022, national average, government primary)
        DRI_MARKET_HIGH: 0.59-0.70 DRI fraction (recent market evidence, commercial source)
        DRI_EAF_HOT_METAL_HEAVY: 0.37 DRI / 0.53 HM (BigMint FY2025, commercial, India-specific)


# =============================================================================
# JPC ROUTE-LEVEL CLOSURE — PHASE 24A (Source: JPC via MoS AR 2025-26)
# =============================================================================
# PHASE 24A: the JPC-sourced route tables were located inside the Ministry of
# Steel Annual Report 2025-26 extract (data/external/extracted/mos_ar_2025_26.txt,
# pp.182-183 of the AR): Annexure-IV (capacity + production by producer AND by
# route-group: OTHER BOF / OTHER EAF / OTHER IF) and Annexure-V (production by
# route), each with "Source: JPC". These reconstruct EXACTLY to the official
# national totals (200,333 kt capacity / 152,180 kt production FY2024-25) and
# the FY23-24 OTHER IF row (68,797 kt) matches the Phase-20 frozen IF aggregate
# 68.8 Mt — internal consistency confirmed. The JPC subscription publication
# (Annual Statistics 2024-25, pp.34/42/73/75) itself remains gated; the MoS AR
# reproduces the same JPC route tables.
#
# FY2024-25 route-level PRODUCTION (Annexure-V + Ch.3 §3.2.3, Source: JPC):
#   BOF 62.488 Mt (41.1%) / EAF 31.612 Mt (20.8%) / IF 58.080 Mt (38.2%);
#   total 152.180 Mt.
#
# FY2024-25 route-level CAPACITY (Annexure-IV producer rows, Source: JPC):
#   Identifiable BOF   : SAIL 20.632 + RINL 7.300 + NMDC 3.000 + OTHER BOF 3.177
#                        = 34.109 Mt
#   Identifiable EAF   : AM/NS 9.600 + OTHER EAF 9.323 = 18.923 Mt
#   IF (full route)    : OTHER IF 81.920 Mt (1,032 units FY23-24 context)
#   Mixed producers    : TSL 21.581 + JSW 34.200 + JSPL 9.600 = 65.381 Mt
#                        (route split WITHIN these is NOT tabulated by JPC)
#   Check              : 34.109 + 18.923 + 81.920 + 65.381 = 200.333 Mt EXACT
#
# CLOSURE STATUS:
#   - Route-level production            : CLOSED (FROZEN_EXTERNAL, JPC via MoS AR)
#   - IF route capacity                 : CLOSED (81.920 Mt, FROZEN_EXTERNAL)
#   - BOF identifiable capacity         : 34.109 Mt (FROZEN_EXTERNAL producer rows)
#   - EAF identifiable capacity         : 18.923 Mt (FROZEN_EXTERNAL producer rows)
#   - Mixed-producer route split        : SUB-GAP 65.381 Mt (JPC does not tabulate
#                                         TSL/JSW/JSPL internal BOF-vs-EAF split)
#   - EAF feedstock split (NG/Coal/Scrap): still GAP (Annexure IV does not split)
#   - Vintages                          : still EXTERNAL_PENDING (JPC capacity
#                                         tables carry no commissioning years)
# =============================================================================
jpc_route_capacity_fy2024_25:
  year: "FY2024-25"
  source: "MoS AR 2025-26 Annexure-IV/Annexure-V (Source: JPC); Ch.3 §3.2.2/§3.2.3"
  pages: "pp.182-183 (Annexure IV/V); §3.2.3 p.15-16"
  provenance: "FROZEN_EXTERNAL"
  confidence: "HIGH"
  producer_capacity_mt:
    SAIL: 20.632
    RINL: 7.300
    NMDC: 3.000
    TSL_Group: 21.581
    AMNS: 9.600
    JSPL: 9.600
    JSW_Group: 34.200
    OTHER_BOF: 3.177
    OTHER_EAF: 9.323
    OTHER_IF: 81.920
  total_capacity_mt: 200.333   # reconstructs exactly from producer rows
  production_by_route_mt:
    BOF: 62.488    # 41.1% share (Annexure V + §3.2.3)
    EAF: 31.612    # 20.8% share
    IF: 58.080     # 38.2% share
  total_production_mt: 152.180
  capacity_by_route_mt:
    BF-BOF:
      identifiable_mt: 34.109   # SAIL+RINL+NMDC+OTHER BOF
      note: "Excludes BOF portion of mixed producers (TSL/JSW/JSPL)."
    NG-DRI-EAF:
      identifiable_mt: 9.600    # AM/NS row only
      note: "Gas-DRI EAF; feedstock split of remaining EAF not tabulated."
    EAF-OTHER:
      identifiable_mt: 9.323    # OTHER EAF row (JPC Annexure IV)
      note: >
        EAF units of 'Other Producers' (9.323 Mt). Feedstock split
        (coal-DRI vs scrap vs gas-DRI) NOT tabulated by JPC — spans the
        Coal-DRI-EAF / Scrap-EAF / NG-DRI-EAF subsets; not allocated to
        any single route (do NOT split by assumption).
    Coal-DRI-EAF:
      identifiable_mt: 0.0
      note: "Subset of EAF-OTHER 9.323 Mt; feedstock split untabulated -> route DEFERRED."
    Coal-DRI-IF:
      identifiable_mt: 81.920   # OTHER IF row = full IF route (JPC)
      note: "IF route capacity CLOSED via JPC Annexure IV OTHER IF row."
    Scrap-EAF:
      identifiable_mt: 0.0
      note: "Subset of EAF-OTHER 9.323 Mt; feedstock split untabulated."
    H2-DRI-EAF:
      identifiable_mt: 0.0
      note: "No commercial H2-DRI plant in India FY2024-25."
  mixed_producers_mt: 65.381   # TSL 21.581 + JSW 34.200 + JSPL 9.600
  mixed_producer_note: >
    JPC Annexure IV lists TSL Group, JSW Group and JSPL as single producer
    rows WITHOUT an internal BOF/EAF route split. This 65.381 Mt is fully
    accounted at producer level but its route allocation is a documented
    SUB-GAP (do not allocate by assumption).
  reconciliation:
    producer_level_gap_mt: 0.0      # 200.333 = sum of Annexure IV producer rows
    route_level_sub_gap_mt: 65.381  # mixed-producer route split not tabulated
    note: >
      The 105.954 Mt reconciliation gap reported in Phase 20 is RESOLVED at
      producer level: the JPC Annexure IV producer rows account for the full
      200.333 Mt. The remaining route-level sub-gap is the TSL/JSW/JSPL
      internal route split (65.381 Mt) plus the EAF feedstock split.

