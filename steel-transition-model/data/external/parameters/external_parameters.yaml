- parameter_id: INTENSITY_COKING_COAL_BF
  parameter: BF-BOF coking coal intensity
  technology: BF-BOF
  year: 2030
  scenario: ALL
  value_min: 0.60
  value_central: 0.89
  value_max: 0.95
  unit: t coking coal / t crude steel
  provenance: EXTERNAL
  source_id: IMC-2021
  source_page: Table 1 (report pp.10-11; verified extract line 379-387)
  derivation: "161 Mt coking coal (10-11% ash) / 181 Mt BF-route crude steel by FY2030
    (NSP-2017 basis) = 0.889 t/t"
  definition: Coking coal requirement per tonne BF-route crude steel, Ministry of
    Coal Inter-Ministerial Committee Report on coking coal (Mission Coking Coal, 2021).
    Planning-demand basis (FY2030); likely slightly understates current practice.
  confidence: MEDIUM
  uncertainty: Planning basis (FY2030); CAG SAIL audit (Report 38 of 2025) coke 397-496
    kg/THM + CDI 38-127 kg/THM implies a lower per-route crude conversion; cross-check
    recorded in DATA_CLOSURE_MASTER_REGISTER.md.
  low_confidence_source: false
  mode_a: true
  mode_b: true
  ml_candidate: false
  status: FROZEN
  notes: "SUPERSEDES prior web-derived record (coke rate 350-550 kg/THM x 1.35 x 0.95
    = 0.45-0.70). That derivation was INVALIDATED (SEC single-fuel shortcut, per-route
    boundary unclear). Promoted value 0.89 derived directly from two printed numbers
    in a primary government source. Registry steel_intensities.yaml BF-BOF/coking_coal
    stays null (EXTERNAL_PENDING) to preserve official baseline invariance; the value
    enters the model via the candidate config intensity_overrides (baseline_data_closed.yaml)."
