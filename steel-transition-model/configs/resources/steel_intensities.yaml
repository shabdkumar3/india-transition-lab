# ============================================================
# Steel Technology Resource Intensities & Energy SEC
# NITI Aayog India Steel Transition Model — Step 5
# ============================================================
#
# STRICT SEPARATION RULES (enforced by code):
#
# energy_sec:       GJ/t steel — system summary only, NOT used as intensity
# electricity_route: MWh/t steel — electricity consumed BY the steel route itself
# electricity_h2:   MWh/t H2   — handled ONLY at system level (see h2_electrolysis)
# hydrogen:         kg H2/t steel — input to H2-DRI-EAF route
# coking_coal:      t/t steel
# non_coking_coal:  t/t steel
# natural_gas:      GJ/t steel  (GJ is appropriate for gas; not SEC confusion)
# iron_ore:         t/t steel
# scrap:            t/t steel
#
# Emissions are tracked separately per emission_type:
#   combustion = from fuel burning (fuel-input-based)
#   process    = from IPPU / chemical reactions (process-based)
#
# Provenance taxonomy:
#   V4               = directly reported in NITI Vol. 4
#   TIMES            = from TIMES model documentation (formulation reference only)
#   DERIVED          = deterministic formula from stated inputs
#   EXTERNAL_PENDING = authoritative source expected but not yet acquired
#   PROJECT_PROPOSAL = approved sensitivity assumption, not source fact
#   UNKNOWN          = no defensible basis found
#
# ============================================================

# ──────────────────────────────────────────────────────────────────────────────
# AUDIT NOTES ON CURRENT TECHNOLOGY CARD VALUES
# ──────────────────────────────────────────────────────────────────────────────
#
# The following issues were found during Step 5 audit of existing cards:
#
# 1. iron_ore intensities (1.40–1.45 t/t) labelled [DERIVED] from "stoichiometric
#    mass balance" — the formula is not fully specified in Vol. 4. Reclassified
#    [EXTERNAL_PENDING] pending authoritative source (e.g., IEA or MoS process data).
#
# 2. scrap intensities labelled [V4] with "Page 15" reference — Vol. 4 p. 15
#    does contain scrap discussion but exact per-route intensity numbers require
#    verification against original Fig 2.7/2.8. Retained as [V4] where page match
#    is clear; downgraded to [EXTERNAL_PENDING] where figure mapping is ambiguous.
#
# 3. BF-BOF coal intensity: 0.75 t coking coal/t steel derived as 27.3/29.3.
#    Numerically plausible but derivation formula mixes SEC (total system energy)
#    with single-fuel calorific value — this ignores the multi-fuel BF energy mix.
#    Reclassified [EXTERNAL_PENDING] pending MoS/IEA coking coal intensity data.
#
# 4. Coal-DRI coal intensities (0.80 t/t) derived as 22.5/28.0.
#    Numerically plausible but same single-fuel SEC shortcut. [EXTERNAL_PENDING].
#
# 5. H2-DRI hydrogen intensity: "55 kg H2/t steel" cited from Vol. 4 p. 65 —
#    this value IS available from Vol. 4. Retained as [V4] with explicit page ref.
#    Note: 0.055 t/t = 55 kg/t — stored here in kg/t steel for clarity.
#
# 6. Electricity intensities derived from SEC sub-components (2.0–2.5 GJ/3.6) —
#    derivation is internally consistent but the sub-component allocation is not
#    independently sourced. Retained as [DERIVED] with formula documented.
#
# 7. Scrap-EAF scrap intensity: "1.0/0.925 = 1.08 t/t" — EAF yield of 92.5%
#    is a standard industry assumption, not sourced from Vol. 4. [EXTERNAL_PENDING].
#
# ──────────────────────────────────────────────────────────────────────────────


# ==============================================================
# SYSTEM-LEVEL: H2 ELECTROLYSIS ELECTRICITY
# (NOT embedded in any route — combined at system level only)
# ==============================================================
h2_electrolysis:
  parameter_id: "ELEC_H2_ELECTROLYSIS"
  value: 55.0
  unit: "MWh/t H2"
  year_start: 2024
  year_end: null   # time-invariant until trajectory justified
  scenario: "ALL"
  provenance: "V4"
  source: "NITI Aayog Sectoral Insights: Industry Vol. 4"
  source_page: "Page 65"
  source_definition: >
    "55 MWh of electricity required per tonne of green hydrogen produced
    via electrolysis, referenced in context of H2-DRI pathway."
  confidence: "HIGH"
  notes: >
    Electrolysis electricity (55 MWh/t H2) is a SYSTEM-LEVEL parameter.
    ElecForH2Steel(t) = H2AllocatedToSteel(t) × 55.
    Must NOT be embedded inside H2-DRI-EAF route electricity_route intensity.


