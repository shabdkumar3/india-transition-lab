# ============================================================
# MODE B POLICY CONFIGURATION (Step 17B) — ACTIVATED
# NITI Aayog India Steel Transition Model
# ============================================================
#
# APPROVAL STATUS (MODE_B_APPROVAL_GATES.md, 2026-08-14):
#   Gate A : APPROVED — "no new capacity after year X" = NCAP[i,t]=0 for t>X.
#   Gate B : NOT APPROVED — Coal-DRI-EAF is NOT given a new-capacity cutoff
#            (Vol.4 names only Coal-DRI-IF for the 2030 rule).
#   Gate C : APPROVED (Interpretation A) — NZS scrap waypoints are
#            POST-SOLVE DIAGNOSTICS (MATCH/BELOW/ABOVE), NOT MILP constraints.
#   Gate F : APPROVED (staged) — only the directly source-supported policy
#            availability rules below are implemented.
#
# EXPLICITLY NOT IMPOSED (Gate F):
#   - carbon price          (Vol.4 provides no numeric carbon price)
#   - emissions cap         (no source-supported steel-sector emissions cap)
#   - Coal-DRI-EAF cutoff   (Gate B)
#   - hard scrap floor      (Gate C — diagnostics only)
# Green-electricity numeric parameters remain EXTERNAL_PENDING.
#
# This file is byte-for-byte the Step 9 MODE B dynamic-scrap configuration
# (configs/optimization/mode_b_dynamic_scrap.yaml) PLUS the `mode_b_policy`
# block below. It is the official Mode B policy run configuration path.
#
# ABNF of the policy block:
#   mode_b_policy:
#     enabled: bool
#     label: str
#     provenance: str
#     scenario_policies:
#       <SCENARIO>:
#         ncap_cutoff_years: {<route>: <year>}    # Gate A / F
#         route_start_years:  {<route>: <year>}    # Gate F availability window
#     scrap_waypoints:
#       <SCENARIO>: [{year, share}]               # Gate C diagnostics only
#     explicit_non_rules: {<name>: <note>}          # provenance-visible exclusions

# ------------------------------------------------------------------
# MODE B POLICY BLOCK (Step 17B)
# ------------------------------------------------------------------
mode_b_policy:
  enabled: true
  label: "MODE_B_POLICY"
  provenance: "EXTERNAL"
  scenario_policies:
    CPS:
      # Gate F (CPS): Coal-DRI-IF no new capacity after 2030.
      #   (Route is not economically enabled in this run; the cutoff is
      #    recorded and binds as soon as Coal-DRI-IF full-plant economics
      #    are acquired and the route is enabled.)
      # Gate A (CPS): BF-BOF — new capacity ALLOWED per Vol.4 CPS.
      #   Vol.4 Table 3.1: "Dominance of BF-BOF till 2050, beyond which annual
      #   capacity addition reduces." No hard NCAP cutoff in CPS — BF-BOF is the
      #   cost-optimal incumbent and MILP may build it through mid-century.
      #   Vol.4 CPS result: ~50% of 820 Mt in 2070 (~410 Mt) from BF-BOF.
      #   BF-BOF removed from ncap_cutoff_years for CPS (no cutoff imposed).
      #   Monotonic production decline applied from 2055 — post-peak phase-down.
      ncap_cutoff_years:
        "Coal-DRI-IF": 2030
        # BF-BOF: NOT_IMPOSED in CPS (Vol.4 Table 3.1 — dominance through 2050)
      monotonic_decline_from_years:
        "BF-BOF":       2055   # Post-peak: production cannot reverse after 2055.
                               # CPS allows BF-BOF to grow near-term (India actively building BF-BOF
                               # through 2030). Monotonic constraint only applies post-peak. [V4_DERIVED]
        "Coal-DRI-IF":  2024   # Step 26: moved from 2028 to 2024. Vol.4 CPS shows Coal-DRI-IF as a
                               # DECLINING route — it loses market share throughout 2024-2070.
                               # Setting from_year=2024 means ACT[t+1]<=ACT[t] for ALL t>=2024,
                               # so production can only stay flat or decline from 2024 levels.
                               # This prevents "last-chance-year" spikes regardless of parameter
                               # changes: wherever we set the monotonic cutoff, the model maximises
                               # in that year. The only fix is to start at 2024. [V4_DERIVED]
      # Step 26: BF-BOF minimum production floor (Vol.4 CPS — "dominant through 2050").
      # Vol.4 Table 3.1 explicitly states BF-BOF dominance in CPS. Without a floor,
      # Lab parameter sensitivity can collapse BF-BOF unrealistically when Coal-DRI-IF
      # economics are slightly more favourable. These are LOWER BOUNDS (conservative —
      # model can produce more). Anchor years interpolated linearly by constraints.py.
      # Provenance: [V4_DERIVED] — anchored to Vol.4 Table 3.1 CPS production narrative.
      min_production_floor_mt:
        "BF-BOF":
          2024: 55.0   # Vol.4 actual ~61 Mt; floor at 90% to allow model flex [V4_DERIVED]
          2030: 62.0   # India actively building BF-BOF; growing fleet [V4_DERIVED]
          2040: 72.0   # dominant through 2040 (Vol.4 Table 3.1 CPS) [V4_DERIVED]
          2050: 82.0   # still dominant per Vol.4 CPS — absolute floor, not target [V4_DERIVED]
          2060: 48.0   # gradual decline phase begins post-2050 [V4_DERIVED]
          2070: 28.0   # residual fleet (Vol.4 CPS: BF-BOF persists in 2070) [V4_DERIVED]
      # Gate F (CPS): H2-DRI-EAF commercialisation starts from 2035.
      route_start_years:
        "H2-DRI-EAF": 2035
    NZS:
      # Gate F (NZS): Coal-DRI-IF no new capacity after 2030;
      #               NG-DRI-EAF no new capacity after 2040;
      #               BF-BOF no new addition after 2060 — Vol.4 Table 3.1:
      #               "no new addition after 2060; BF-BOF capacity that remains
      #               in 2070 is coupled with CCS/CCUS." With 3-yr lead time,
      #               NCAP cutoff set to 2057 so last capacity commissions by 2060.
      #               Monotonic production decline from 2040 (end of dominance).
      ncap_cutoff_years:
        "Coal-DRI-IF": 2030
        "NG-DRI-EAF": 2040
        "BF-BOF": 2057   # →capacity enters by 2060; after that no new BF-BOF [V4_DERIVED]
      monotonic_decline_from_years:
        "BF-BOF":      2040   # dominance through 2040, then production can only decline [V4_DERIVED]
        "Coal-DRI-IF": 2026   # Step 26b: NZS-specific fix. Monotonic from 2024 causes infeasibility
                               # in NZS 2024-2025 (high carbon price pushes Coal-DRI-IF low in 2024,
                               # then monotonic locks 2025 too low to meet demand). Setting from_year=2026
                               # gives the model 2 free years (2024-2025) where Carbon price already
                               # drives Coal-DRI-IF down naturally — no spike observed (confirmed by
                               # diagnostic run: Coal-DRI-IF 45.9%→40.7%→39.9%→33.1%→0% monotone).
                               # NZS from_year=2026 is the minimum feasible year (bisection tested).
                               # Vol.4 NZS shows Coal-DRI-IF declining toward 0%. [V4_DERIVED]
      # Step 26: NZS BF-BOF floor (early years). NZS allows fast BF-BOF decline post-2040, but
      # BF-BOF at 0% by 2028 is unrealistic (existing 80 Mt fleet cannot retire overnight).
      # Floor prevents premature collapse before 2035; model free to decline after that.
      min_production_floor_mt:
        "BF-BOF":
          2024: 45.0   # existing fleet ~61 Mt actual; floor at 73% — NZS allows faster transition [V4_DERIVED]
          2030: 40.0   # NZS: BF-BOF declining faster but still active [V4_DERIVED]
          2035: 25.0   # H2-DRI starts taking share from 2030 in NZS [V4_DERIVED]
          2040: 10.0   # by 2040 BF-BOF declining sharply in NZS — near-zero OK [V4_DERIVED]
          2050: 0.0    # model can retire all BF-BOF by 2050 in NZS [V4_DERIVED]
      # Gate F (NZS): H2-DRI-EAF commercialisation starts from 2030.
      route_start_years:
        "H2-DRI-EAF": 2030
  # Gate C: NZS scrap waypoints — POST-SOLVE DIAGNOSTIC TARGETS ONLY.
  scrap_waypoints:
    NZS:
      - {year: 2025, share: 0.20}
      - {year: 2050, share: 0.30}
      - {year: 2070, share: 0.40}
  explicit_non_rules:
    carbon_price: "NOT_IMPOSED (Vol.4 provides no numeric carbon price)"
    emissions_cap: "NOT_IMPOSED (no source-supported steel emissions cap)"
    coal_dri_eaf_cutoff: "NOT_IMPOSED (Gate B: Vol.4 names only Coal-DRI-IF)"
    hard_scrap_floor: "NOT_IMPOSED (Gate C: waypoints are diagnostics only)"
    green_electricity_numeric: "EXTERNAL_PENDING (no numeric grid/CAPTIVE data)"

