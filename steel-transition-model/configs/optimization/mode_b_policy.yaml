# ECONOMICS — all 6 routes
#
# Provenance tiers:
#   [EXTERNAL FROZEN]     = verified against published IEA/WorldSteel cost tables;
#                           value will not change without a new external source.
#   [EXTERNAL CROSSREF]   = cross-referenced from two or more published sources
#                           (IEA/IRENA/CEEW); values within published ranges;
#                           flagged as provisional until a single auditable
#                           Indian project-level source is confirmed.
#
# BF-BOF:      IEA Iron & Steel Technology Roadmap 2020, Table 2.1. [EXTERNAL FROZEN]
# NG-DRI-EAF:  IEA Roadmap 2020, Table 2.3. [EXTERNAL FROZEN]
# Scrap-EAF:   IEA Roadmap 2020, Table 2.4. [EXTERNAL FROZEN]
# H2-DRI-EAF:  CAPEX $64.2/t: IEA Roadmap 2020 + IRENA Breakthrough Agenda 2022
#               (DRI-EAF range $50–70/t annualised at 8% WACC, 30yr lifetime).
#               OPEX $27.4/t: ~4.3% of CAPEX (IEA/IRENA fixed O&M range 3–5%).
#               [EXTERNAL CROSSREF — provisional]
# Coal-DRI-EAF: CAPEX $82/t: CEEW 2024 India Steel Cluster Survey + IEA DRI cost
#               ranges for coal-based systems. [EXTERNAL CROSSREF — provisional]
# Coal-DRI-IF:  CAPEX $61.5/t: same source basis as Coal-DRI-EAF; IF furnace
#               lower CAPEX than EAF (established Indian secondary route).
#               [EXTERNAL CROSSREF — provisional]
# ============================================================
economics:
  capex_annualised_usd_per_t:
    "BF-BOF":       73.0    # IEA Roadmap 2020 Table 2.1 [EXTERNAL FROZEN]
    "Coal-DRI-EAF": 82.0    # CEEW 2024 + IEA DRI ranges [EXTERNAL CROSSREF]
    "Coal-DRI-IF":  61.5    # CEEW 2024 + IEA; IF lower CAPEX than EAF [EXTERNAL CROSSREF]
    "NG-DRI-EAF":   95.0    # IEA Roadmap 2020 Table 2.3 [EXTERNAL FROZEN]
    "H2-DRI-EAF":   64.2    # IEA 2020 + IRENA 2022; range $50-70/t [EXTERNAL CROSSREF]
    "Scrap-EAF":    46.0    # IEA Roadmap 2020 Table 2.4 [EXTERNAL FROZEN]
  opex_fixed_usd_per_t:
    "BF-BOF":       68.0    # IEA Roadmap 2020 [EXTERNAL FROZEN]
    "Coal-DRI-EAF": 35.0    # CEEW 2024 estimate [EXTERNAL CROSSREF]
    "Coal-DRI-IF":  26.0    # CEEW 2024 estimate [EXTERNAL CROSSREF]
    "NG-DRI-EAF":   87.0    # IEA Roadmap 2020 [EXTERNAL FROZEN]
    "H2-DRI-EAF":   27.4    # ~4.3% of CAPEX; IEA/IRENA O&M range 3-5% [EXTERNAL CROSSREF]
    "Scrap-EAF":    43.0    # IEA Roadmap 2020 [EXTERNAL FROZEN]
  vom_usd_per_t:
    # Variable O&M: consumables (electrodes, refractories, oxygen, flux, lime).
    # Sources: IEA Iron & Steel Technology Roadmap 2020 Annex A.5;
    #          WorldSteel Cost Benchmark 2023 (industry average ranges).
    # EAF-based routes have higher VOM due to graphite electrode consumption
    # (~3-5 kg/t × ~$3/kg). IF has lower electrode cost. BF-BOF mainly
    # oxygen injection and auxiliary consumables. All [EXTERNAL CROSSREF].
    "BF-BOF":       7.0     # oxygen, coke auxiliaries, maintenance consumables [EXTERNAL CROSSREF]
    "Coal-DRI-EAF": 10.0    # rotary kiln consumables + EAF electrodes ~3.5 kg/t [EXTERNAL CROSSREF]
    "Coal-DRI-IF":  6.0     # IF has much lower electrode cost than EAF [EXTERNAL CROSSREF]
    "NG-DRI-EAF":   12.0    # EAF electrodes 3.5 kg/t × $3/kg + refractories [EXTERNAL CROSSREF]
