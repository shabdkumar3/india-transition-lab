# ============================================================
# STEP 9 — DYNAMIC SCRAP (MODE B)  <<< ENABLED
# ============================================================
# The full stock-flow chain (Step 9 §6-§10, MODEL_FORMULATION §6):
#
#   Historical production cohorts (tau < 2024)
#   +  modelled production cohorts (tau = 2024..t-1)
#   --(lifetime kernel omega)--> EOL scrap generation
#   --(collection rate)-------> collected scrap
#   --(processing yield)------> usable domestic scrap
#   --(MILP constraint)-------> RES_scrap,t <= usable + imports
#
# The feedback (more production today -> more future EOL scrap -> more
# future Scrap-EAF potential) flows through the EQUATIONS (linear
# coefficients on past ACT in the scrap balance rows), never by forcing
# future route shares (Step 9 §10).
dynamic_scrap:
  enabled: true
  provenance: "PROJECT_PROPOSAL"   # block-level provenance (module is a proposal-level enrichment)

  # 1. HISTORICAL COHORTS  (frozen window 1990-2023, MODEL_FORMULATION §6)
  historical_cohorts:
    unit: "Mt"
    start_year: 1990
    end_year: 2023
    provenance: "EXTERNAL"     # MoS AR 2025-26 production series
    source: "Ministry of Steel Annual Report 2025-26 (JPC production series)"
    source_page: "Table 3.2.2 / production summary"
    production_mt:
      2021:
        value: 103.545
        provenance: "EXTERNAL"
        source: "MoS AR 2025-26 (FY2020-21 crude steel production)"
        notes: "FY2020-21 attributed to calendar 2021 (fiscal-year-end convention)"
      2022:
        value: 120.293
        provenance: "EXTERNAL"
        source: "MoS AR 2025-26 (FY2021-22 crude steel production)"
        notes: "FY2021-22 attributed to calendar 2022 (fiscal-year-end convention)"
    # NOTE: 2023 (FY2022-23) was not extracted from the approved MoS
    # extract -> explicitly missing. 1990-2020 likewise missing.

  # 2. LIFETIME KERNEL  (Step 9 §5)
  lifetime:
    distribution: "weibull"        # "weibull" | "deterministic"
    weibull_shape: 2.5             # [PROJECT_PROPOSAL] beta
    weibull_scale: 20.0            # [PROJECT_PROPOSAL] eta (years)
    deterministic_lifetime_years: 20
    provenance: "PROJECT_PROPOSAL"
    notes: "Weibull(2.5, 20) per ASSUMPTION_DEBT_REGISTER.md; parametric scenario variable for sensitivity."

  # 3. COLLECTION & PROCESSING  (Step 9 §7 — distinct quantities)
  collection:
    collection_rate:
      value: 0.80
      provenance: "PROJECT_PROPOSAL"
      notes: "Parametric scenario variable; empirical Indian series DEFERRED."
    processing_yield:
      value: 0.90
      provenance: "PROJECT_PROPOSAL"
      notes: "Parametric scenario variable; empirical Indian series DEFERRED."

  # 4. SCRAP IMPORTS  (Step 9 §8)
  scrap_imports:
    value: 0.0
    provenance: "EXTERNAL_PENDING"
    notes: "Imports excluded from this version (ScrapUse_t <= UsableDomesticScrap_t). Pathway reserved."

  # 5. HISTORICAL SCRAP SUPPLEMENT (Step 9 remediation)
  # -----------------------------------------------------------
  # The historical cohort model only has 2021-2022 production data from
  # the MoS AR 2025-26 extract. Production for 1990-2020 is EXTERNAL_PENDING
  # (34 years of data gaps). Without these cohorts, the dynamic scrap engine
  # produces near-zero EOL scrap in 2024-2035, which makes the model infeasible
  # once real scrap intensities are applied (BF-BOF uses 0.15 t scrap/t steel).
  #
  # This supplement provides usable scrap from those unmodeled cohorts. Values
  # are derived from WorldSteel India production estimates (1990-2020) convolved
  # with Weibull(2.5, 20) EOL kernel × CR × PY — the same formula used for
  # tracked cohorts, but applied to the missing-data years as a lump estimate.
  #
  # The supplement DECREASES over time as:
  #   (a) The pre-2021 stock progressively reaches EOL (Weibull distribution
  #       spreads this over 2024-2055)
  #   (b) Model-year production (from 2024 onward) increasingly dominates
  #       the scrap supply through the feedback equations (constraint 7 ACT terms)
  #
  # Provenance: PROJECT_PROPOSAL — pending formal acquisition of 1990-2020
  # JPC production series. Conservative (below the WorldSteel-based estimate)
  # to avoid overcounting given the Indian collection/processing uncertainty.
  # Reviewed and accepted 2026-08-18 as interim working value.
  historical_scrap_supplement:
    provenance: "PROJECT_PROPOSAL"
    rationale: >
      Estimated usable EOL scrap from 1990-2020 production cohorts (EXTERNAL_PENDING
      in the cohort model). Recalibrated upward from 22 Mt to 30 Mt in 2024 to
      match Vol.4 actual total scrap consumption = 33.36 Mt (p.43, Fig 2.7).
      The 30 Mt (vs 33.36 Mt) reflects that the supplement covers EOL + home/process
      scrap for non-tracked pre-2021 cohorts; the 3 Mt gap is covered by 2021-2022
      tracked cohort contributions from the dynamic scrap engine. With all 6 routes
      now enabled, the scrap balance includes BF-BOF (0.15), Coal-DRI-EAF (0.20),
      Coal-DRI-IF (0.15), NG-DRI-EAF (0.20) secondary charges PLUS Scrap-EAF primary.
    anchor_years_mt:
      # Calibrated to Vol.4 FY2024 scrap total (33.36 Mt) + growing EOL:
      2024: 30.0   # Vol.4 actual 33.36 Mt; supplement covers pre-2021 EOL
      2028: 34.0   # 2010-2015 cohorts peak EOL (age ~13-18yr at Weibull mode)
      2032: 32.0   # declining as 1990-2010 stock depletes
      2040: 22.0   # model-year cohorts increasingly dominant
      2050: 10.0   # mostly pre-2021 stock depleted; model cohorts dominate
      2060: 4.0    # tail contribution only
      2070: 1.0    # negligible pre-2021 stock remaining

# ============================================================
# PROVENANCE GATING — all 6 routes
# ============================================================
provenance_gating:
  policy: "strict"
  allow_proposal_parameters: true
  intensity_overrides:
    # ----------------------------------------------------------------
    # Scrap-EAF / scrap input intensity (1.08 t/t — primary charge)
    # ----------------------------------------------------------------
    - route: "Scrap-EAF"
      resource: "scrap"
      value: 1.08
      provenance: "PROJECT_PROPOSAL"
      rationale: >
        IEA Roadmap 2020 / IMC-2021 EAF mass balance: ~1.08 t scrap per t
        liquid steel. Activates the physical scrap cost and enables the
        Mode B dynamic scrap balance to meaningfully constrain Scrap-EAF.
    # ----------------------------------------------------------------
    # Iron ore intensities (t iron ore / t crude steel)
    # Sources: IEA Iron & Steel Technology Roadmap 2020 Table A.1 / Annex A;
    #          WorldSteel Statistical Yearbook 2023 (BF mass balance);
    #          MIDREX DRI Technology Report 2022 (shaft furnace mass balance).
    # BF-BOF: ~1.55-1.65 t/t; WorldSteel average 1.60 t/t [EXTERNAL CROSSREF]
    # Shaft-furnace DRI (NG/H2): ~1.40-1.44 t/t; IEA 2020 Table A1 = 1.42 [EXTERNAL CROSSREF]
    # Rotary kiln DRI (Coal): slightly lower metallization (~92%) → ~1.45 t/t [EXTERNAL CROSSREF]
    # Scrap-EAF: zero (no iron ore — all scrap charge; no override needed)
    # ----------------------------------------------------------------
    - route: "BF-BOF"
      resource: "iron_ore"
      value: 1.60
      provenance: "EXTERNAL CROSSREF"
      rationale: >
        WorldSteel Statistical Yearbook 2023 BF mass balance: 1.55-1.65 t iron ore
        per t crude steel; IEA Iron & Steel Technology Roadmap 2020 Table A.1: 1.60 t/t.
        Uses standard burden rate assuming sinter/pellet mix (58% Fe) consistent with
        India's major integrated plants (SAIL, Tata, JSW benchmarks).
    - route: "NG-DRI-EAF"
      resource: "iron_ore"
      value: 1.42
      provenance: "EXTERNAL CROSSREF"
      rationale: >
        IEA Iron & Steel Technology Roadmap 2020 Table A.1 shaft-furnace DRI mass balance:
        1.40-1.44 t iron ore / t crude steel at 94% metallization (Midrex/HYL grade).
        Using 1.42 t/t as central estimate. Pellet grade iron ore (64-67% Fe).
    - route: "H2-DRI-EAF"
      resource: "iron_ore"
      value: 1.42
      provenance: "EXTERNAL CROSSREF"
      rationale: >
        Same shaft-furnace DRI process as NG-DRI-EAF (HYFOR/Midrex H2-ready).
        IEA 2020 / MIDREX H2 report: 1.42 t iron ore / t crude steel at 94% metallization.
        No significant difference from NG-DRI in ore consumption per mass-balance.
    - route: "Coal-DRI-EAF"
      resource: "iron_ore"
      value: 1.45
      provenance: "EXTERNAL CROSSREF"
      rationale: >
        Rotary kiln DRI (SL/RN process) has slightly lower metallization (~91-93%)
        than shaft furnace, requiring modestly more ore. IEA 2020 / CEEW 2024 estimate:
        1.44-1.47 t/t; using 1.45 t/t as central value for India's Coal-DRI plants.
    - route: "Coal-DRI-IF"
      resource: "iron_ore"
      value: 1.45
      provenance: "EXTERNAL CROSSREF"
      rationale: >
        Same rotary kiln DRI process as Coal-DRI-EAF. Induction furnace melting does not
        change the DRI production mass balance. 1.45 t/t consistent with Vol.4 Fig 2.8
        and India's sponge iron industry standards (70-80 Mtpa rotary kiln fleet).
    # ----------------------------------------------------------------
    # BF-BOF / coking coal intensity (0.89 t/t)
    # ----------------------------------------------------------------
    - route: "BF-BOF"
      resource: "coking_coal"
      value: 0.89
      provenance: "PROJECT_PROPOSAL"
      rationale: >
        IEA Roadmap 2020 / WorldSteel BF coal balance: ~0.89 t coking coal
        per t crude steel. Consistent with Mode A baseline.
    # ----------------------------------------------------------------
    # Coal-DRI-EAF / non-coking coal (1.2 t/t)
    # Derived: Vol.4 Fig 2.8 coal SEC (22.5 GJ/t) / Indian NCC GCV (18.84 GJ/t)
    # ----------------------------------------------------------------
    - route: "Coal-DRI-EAF"
      resource: "non_coking_coal"
      value: 1.2
      provenance: "PROJECT_PROPOSAL"
      rationale: >
        Vol.4 Fig 2.8 coal-thermal SEC (22.5 GJ/t) / Indian non-coking coal
        GCV (18.84 GJ/t at 4500 kcal/kg) = 1.195 t/t ≈ 1.2 t/t. Activates
        dominant fuel cost for Coal-DRI-EAF route.
    # ----------------------------------------------------------------
    # Coal-DRI-IF / non-coking coal (1.2 t/t) — same kiln process
    # ----------------------------------------------------------------
    - route: "Coal-DRI-IF"
      resource: "non_coking_coal"
      value: 1.2
      provenance: "PROJECT_PROPOSAL"
      rationale: >
        Same rotary kiln process as Coal-DRI-EAF. Vol.4 Fig 2.8 kiln coal
        SEC (22.5 GJ/t) / 18.84 GJ/t = 1.195 ≈ 1.2 t/t. The IF route uses
        ~70% DRI charge in the IF, with the same kiln-based DRI process.
    # ----------------------------------------------------------------
    # MODE B SCRAP BALANCE NOTE (2026-08-18):
    # With all 6 routes enabled and historical_scrap_supplement recalibrated
    # to 30 Mt (matching Vol.4 actual 33.36 Mt), the scrap balance now
    # includes ALL route secondary scrap charges from registry values:
    #   BF-BOF: 0.15 t/t (V4)  — secondary BOF charge
    #   Coal-DRI-IF: 0.15 t/t (V4) — secondary IF charge
    #   Coal-DRI-EAF: 0.20 t/t (V4) — secondary EAF charge
    #   NG-DRI-EAF: 0.20 t/t (V4) — secondary EAF charge
    # No longer overridden to 0.0 (prior interim fix removed now that
    # Coal-DRI/H2-DRI routes are enabled and supplement is recalibrated).
    # The dynamic balance naturally constrains all scrap consumption.
    # ----------------------------------------------------------------

# ============================================================
# STEP 20 REALISM ENHANCEMENTS
# Approved scope: PROJECT_PROPOSAL parameters — clearly labelled.
# These features improve pathway realism without claiming Vol.4 source support.
# ============================================================

# (A) ENDOGENOUS LEARNING — Step 20 / Learning-by-Doing
# CAPEX declines with cumulative deployment: C_t = C_0 * (Q_t/Q_0)^(-b)
# b = -log2(1 - learning_rate). Solved via outer iteration loop.
endogenous_learning:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    Learning rates from IRENA/IEA learning curve literature.
    H2-DRI-EAF: nascent technology, strong learning expected (10% per doubling).
    Scrap-EAF: mature technology, weak learning (5% per doubling).
  tolerance: 0.001
  max_iterations: 50
  routes:
    "H2-DRI-EAF":
      learning_rate: 0.10          # 10% cost reduction per doubling of cumulative capacity
      initial_cumulative_capacity_mt: 0.5   # ~0.5 Mt global H2-DRI installed in 2024
      learning_scope: "full_plant"
      provenance: "PROJECT_PROPOSAL"
    "Scrap-EAF":
      learning_rate: 0.05          # 5% cost reduction per doubling (mature EAF technology)
      initial_cumulative_capacity_mt: 500.0  # ~500 Mt global EAF installed in 2024
      learning_scope: "full_plant"
      provenance: "PROJECT_PROPOSAL"

# (B) CARBON PRICE — Step 20 / Policy scenario
# Adds df(t) * carbon_price[t] to the CO2[t] objective coefficient.
# CPS: India's PAT/CCTS trajectory (moderate ramp).
# NZS: IEA NZE-aligned trajectory (aggressive ramp).
# Source basis: IEA NZE 2023 Fig 2.5 (adapted for India via discount).
carbon_price:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    India-adapted carbon price trajectories. CPS reflects PAT evolution +
    CCTS pilot (modest). NZS reflects IEA NZE 2050 developing-economy
    trajectory (140 USD/tCO2 by 2050). Values are indicative, not official.
  trajectories:
    CPS:
      2024: 2      # India PAT scheme (~$2 equivalent signal)
      2030: 8      # CCTS pilot stage
      2040: 16     # Gradual ramp — no formal carbon market in CPS
      2050: 24     # Weak signal: ~$20–25/t reflects India policy ambition gap
      2060: 30
      2070: 35     # Step 25: reduced from $130 → $35 (NITI CPS has no enacted carbon price;
                   # $35/t = weak PAT-equivalent signal, not a formal carbon market)
    NZS:
      2024: 5
      2030: 30
      2040: 80
      2050: 140
      2060: 175
      2070: 200

# (C) H₂ SUPPLY CAP — Step 20 / Infrastructure ramp
# Upper bound on RES["hydrogen",t] per year.
# Limits H2-DRI-EAF growth to the available electrolysis + H2 pipeline
# infrastructure ramp-up trajectory for India.
# CPS: conservative NGHM implementation. NZS: NGHM fully funded + push.
h2_supply_cap:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    India National Green Hydrogen Mission (NGHM, 2023) targets 5 MMTPA
    green H2 by 2030. CPS: only 40% steel share achieved; NZS: 70%+ steel
    share + extra Mission funding doubles the ramp. Cap in Mt H2/yr.
  # Fallback for backward-compat (old code reads anchor_years_mt directly).
  # New code reads trajectories.{scenario}.anchor_years_mt first.
  # Values here are midpoints of CPS/NZS — should not be reached by current loader.
  anchor_years_mt:
    2024: 0.001
    2030: 0.38
    2035: 1.20
    2040: 3.5
    2050: 8.0     # midpoint: CPS=2.5, NZS=14.0
    2060: 14.5    # midpoint: CPS=7.0, NZS=22.0
    2070: 22.0    # midpoint: CPS=14.0, NZS=30.0
  trajectories:
    CPS:
      anchor_years_mt:
        2024: 0.001    # effectively zero today
        2030: 0.20     # CPS: 5 MMTPA × 20% steel share → ~0.2 Mt H2
        2035: 0.60     # moderate ramp
        2040: 2.0      # ~36 Mt H2-DRI steel capacity
        2050: 2.5      # Vol.4 CPS steel-specific H2 = 2.0 Mt; cap slightly above [V4_DERIVED]
        2060: 7.0      # interpolated between 2.5 (2050) and 13.3 Mt (2070 Vol.4) [V4_DERIVED]
        2070: 14.0     # Vol.4 CPS steel H2 = 13.3 Mt; ceiling set just above [V4_DERIVED]
    NZS:
      anchor_years_mt:
        2024: 0.001    # effectively zero today
        2030: 0.55     # NZS: NGHM fully backed; 5 MMTPA × 55% share + imports
        2035: 1.80     # accelerated H2 ecosystem
        2040: 5.0      # deep push: ~91 Mt H2-DRI steel capacity
        2050: 14.0     # Vol.4 NZS steel-specific H2 = 13.0 Mt; cap just above [V4_DERIVED]
        2060: 22.0     # near-full decarbonization scenario
        2070: 30.0     # Vol.4 NZS steel H2 = 28.2 Mt; ceiling set above [V4_DERIVED]

# (D) STRANDED-ASSET COST — Step 20 / Financial realism
# Penalty on RET[i,t] = stranded_cost_fraction × annCapex_i.
# Represents balance-sheet write-down on premature closure of
# existing plants before end of technical lifetime.
stranded_asset_cost:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    Fraction of annualised CAPEX that represents stranded value on early
    retirement. 0.30 means 30% of annual CAPEX is "lost" per Mt retired
    before lifetime. This discourages economically unjustified premature
    retirement. Based on IEA asset-stranding cost literature (indicative).
  stranded_cost_fraction: 0.30

# (E) TIME-VARYING RESOURCE PRICES — Step 20 / Learning curves
# Hydrogen and electricity prices decline with electrolyser learning +
# RE expansion. CPS/NZS differ: NZS has faster learning + stronger policy.
# Loader checks trajectories.{scenario}.anchor_years first; falls back to
# anchor_years if no scenario sub-block exists (backward-compat for scrap).
resource_price_trajectories:
  hydrogen:
    provenance: "PROJECT_PROPOSAL"
    notes: >
      IEA Hydrogen Roadmap 2023 + IRENA 2022 Green Hydrogen Cost Review.
      CPS: moderate NGHM + global learning → $1.10/kg by 2040.
      NZS: NGHM fully funded + accelerated electrolyser learning → $0.60/kg by 2040.
      H2-DRI-EAF fuel cost at 55 kg/t: CPS=$60/t, NZS=$33/t at 2040 — key divergence.
    # Fallback for backward-compat (old code reads anchor_years directly).
    # New code reads trajectories.{scenario}.anchor_years first.
    anchor_years:
      2024: 1.90
      2030: 1.475  # average of CPS(1.65) and NZS(1.30)
      2035: 1.125  # average of CPS(1.35) and NZS(0.90)
      2040: 0.85   # average of CPS(1.10) and NZS(0.60)
      2050: 0.675  # average
      2060: 0.57
      2070: 0.50
    trajectories:
      CPS:
        anchor_years:
          2024: 1.90
          2030: 1.65
          2035: 1.35
          2040: 1.10
          2050: 0.90
          2060: 0.78
          2070: 0.70
      NZS:
        anchor_years:
          2024: 1.90
          2030: 1.30
          2035: 0.90
          2040: 0.60
          2050: 0.45
          2060: 0.36
          2070: 0.30
  electricity:
    provenance: "PROJECT_PROPOSAL"
    notes: >
      India RE electricity (solar+wind weighted avg) cost trajectory.
      CPS: NDC-consistent RE expansion, moderate pace.
      NZS: 500 GW RE by 2030 fully realised, deeper grid cost decline.
    # Fallback for backward-compat (old code reads anchor_years directly).
    # New code reads trajectories.{scenario}.anchor_years first.
    anchor_years:
      2024: 45.0
      2030: 37.0   # average of CPS(40.0) and NZS(34.0)
      2040: 27.0   # average of CPS(32.0) and NZS(22.0)
      2050: 20.0   # average
      2060: 16.0
      2070: 13.5
    trajectories:
      CPS:
        anchor_years:
          2024: 45.0
          2030: 40.0
          2040: 32.0
          2050: 24.0
          2060: 20.0
          2070: 17.0
      NZS:
        anchor_years:
          2024: 45.0
          2030: 34.0
          2040: 22.0
          2050: 16.0
          2060: 12.0
          2070: 10.0
  # (F) Scrap price feedback: growing EAF demand tightens domestic scrap
  # supply and pushes up marginal acquisition cost over time.
  # Scenario-invariant (scrap market dynamics don't differ by climate policy).
  scrap:
    provenance: "PROJECT_PROPOSAL"
    notes: >
      India domestic scrap price trajectory. Base $250/t (2024) rising as
      Scrap-EAF fleet grows and collection-system competition intensifies.
      Sources: WorldSteel Scrap Monitor 2023; IEA CCUS/steel cost review.
      Represents partial scrap price feedback (exogenous approximation).
    anchor_years:
      2024: 250.0
      2030: 268.0
      2040: 305.0
      2050: 355.0
      2060: 385.0
      2070: 400.0

# ============================================================
# STEP 21 REALISM ENHANCEMENTS (batch 2)
# ============================================================

# (A) GRID EMISSION INTENSITY — Step 21
# Adds electricity-based indirect CO₂ to constraint 6:
#   CO2[t] += ACT[i,t] * elec_intensity[i] * grid_ei[t]
# CPS: NDC-consistent grid decarbonization. NZS: deeper RE push, faster decline.
# Loader checks trajectories.{scenario}.grid_ei_tco2_per_mwh first, falls back
# to grid_ei_tco2_per_mwh if no scenario sub-block (backward-compat).
grid_emission_intensity:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    India grid average emission factor from CEA CO2 baseline 2022-23 (716 gCO2/kWh).
    CPS: follows India's NDC trajectory (500 GW RE by 2030, moderate thereafter).
    NZS: deeper RE push, near-zero grid by 2060 — makes EAF/H2-DRI cleaner sooner.
    Applied to all routes with non-zero electricity_route intensity.
  # Fallback for backward-compat (old code reads grid_ei_tco2_per_mwh directly).
  # New code reads trajectories.{scenario}.grid_ei_tco2_per_mwh first.
  grid_ei_tco2_per_mwh:
    2024: 0.716
    2030: 0.523   # average of CPS(0.565) and NZS(0.480)
    2040: 0.305   # average of CPS(0.360) and NZS(0.250)
    2050: 0.165   # average
    2060: 0.080
    2070: 0.037
  trajectories:
    CPS:
      grid_ei_tco2_per_mwh:
        2024: 0.716   # CEA CO2 baseline 2022-23
        2030: 0.565   # 40% non-fossil capacity (NDC)
        2040: 0.360   # 60% RE — moderate pace
        2050: 0.210   # 70-75% RE
        2060: 0.110   # partial decarbonization
        2070: 0.055   # residual fossil fraction in CPS
    NZS:
      grid_ei_tco2_per_mwh:
        2024: 0.716   # CEA CO2 baseline 2022-23
        2030: 0.480   # deeper RE push achieves 50% non-fossil by 2030
        2040: 0.250   # 75% RE — NZS ambition
        2050: 0.120   # 85-90% RE
        2060: 0.050   # near-zero grid
        2070: 0.020   # negligible fossil (residual peakers only)

# (B) CONSTRUCTION LEAD TIME — Step 21
# NCAP[i,t] commissioned at year t contributes to CAP from t + lead_time.
# Investment decisions have multi-year build lag — critical for pathway timing.
# BF-BOF and H2-DRI-EAF face longest lead times (complex / H2 infra co-build).
construction_lead_time:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    Technology-specific construction and commissioning lag.
    Sources: IEA WEO 2023 investment timing annex; ISPATGURU plant timelines.
    H2-DRI-EAF lead includes electrolyser + H2 storage installation.
    EAF/Scrap-EAF shortest (modular, established supply chain).
  lead_time_years:
    "BF-BOF":       3    # large integrated plant: 3-5 yr (IEA); using lower end
    "Coal-DRI-EAF": 2    # rotary kiln DRI + EAF: 2-4 yr
    "Coal-DRI-IF":  2    # rotary kiln DRI + IF: 2-4 yr
    "NG-DRI-EAF":   2    # shaft furnace DRI + EAF: 2-4 yr
    "H2-DRI-EAF":   3    # green H2 DRI + EAF + H2 infra: 3-5 yr
    "Scrap-EAF":    1    # EAF only (modular): 1-2 yr

# (C) WACC RISK PREMIUM — Step 21
# Effective CAPEX is multiplied by this factor for financing-cost realism.
# Nascent / higher-risk technologies face higher cost of capital in India's
# capital markets, making their effective annualised CAPEX larger.
wacc_premium:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    Risk premium reflecting differential financing cost for nascent vs mature
    technologies in India's capital markets. Based on IEA WEO 2023 financing
    cost analysis (developing economies, coal vs green technology). BF-BOF
    and Coal-DRI are mature (no premium); H2-DRI faces higher perceived risk.
  premium_by_route:
    "BF-BOF":       1.00   # mature, bankable — no premium
    "Coal-DRI-EAF": 1.08   # slightly non-standard for India
    "Coal-DRI-IF":  1.05   # mature kiln process
    "NG-DRI-EAF":   1.05   # proven technology, gas risk premium
    "H2-DRI-EAF":   1.25   # nascent: higher perceived risk, limited lender track record
    "Scrap-EAF":    1.00   # mature, very bankable

# (D) POLICY INCENTIVES / PLI SUBSIDIES — Step 21
# Negative cost on ACT[i,t] — represents India's Production Linked Incentive
# and Green Steel Mission support for strategic decarbonisation routes.
# Negative USD/t = subsidy (reduces effective production cost).
policy_incentives:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    India Green Steel PLI-equivalent subsidy schedule (indicative).
    H2-DRI-EAF: front-loaded (heavy subsidy 2030-2040, tapers as technology matures).
    Scrap-EAF: smaller steady subsidy (scrap collection infrastructure support).
    Sources: SAIL/MoS Green Steel Mission announcements; IEA CCUS for Steel 2023.
  incentives_usd_per_t:
    "H2-DRI-EAF":
      2030: -20.0    # heavy PLI to bootstrap first commercial plants
      2035: -15.0
      2040: -10.0    # tapering as technology reaches grid parity
      2045: -5.0
      2050: 0.0      # no subsidy needed — competitive on own merits
    "Scrap-EAF":
      2024: -4.0     # scrap collection / processing support
      2030: -3.0
      2040: -2.0
      2050: -1.0
      2060: 0.0

# (E) GREEN-STEEL PREMIUM — Step 21
# Revenue bonus for routes whose total emission intensity < threshold.
# Represents willingness-to-pay premium from green-steel buyers (automotive,
# EU CBAM importers, ESG-rated supply chains).
green_steel_premium:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    Green-steel market premium for low-emission steel production.
    Threshold: routes with process+combustion tCO2/t < 0.5 qualify.
    Growing demand from EU CBAM (effective 2026), automotive OEMs (BMW/VW
    green procurement), and India's own green procurement policy.
    Sources: Hatch/KPMG Green Steel Market Report 2023; Wood Mackenzie 2023.
  emission_threshold_tco2_per_t: 0.5
  qualifying_routes:
    - "H2-DRI-EAF"    # near-zero if green H2 (process + combustion both small)
    - "Scrap-EAF"     # low emission (EAF, no ironmaking step)
  premium_usd_per_t:
    2024: 0.0     # premium not yet established in India
    2030: 8.0     # EU CBAM fully operational; early movers benefit
    2035: 18.0
    2040: 32.0    # mainstream green procurement
    2050: 48.0
    2060: 58.0
    2070: 65.0

# ============================================================
# STEP 22B — CCUS (Carbon Capture, Utilisation and Storage)
# ============================================================
# Reduces process+combustion emission intensity of eligible routes by
# capture_rate (0 = no capture; 0.85 = 85% CO₂ captured and stored).
# Adds additional CAPEX and OPEX to represent CCS plant investment and
# operating costs. Available from available_from_year (technology readiness).
#
# Source: IEA CCUS for Steel (2023); IEAGHG Iron & Steel CCS Study (2013);
#         NITI Vol.4 NZS Table 3.1 notes "BF-BOF capacity in 2070 coupled with CCS".
#
# ENABLED VIA LAB: This flag is the default (Lab off → no CCUS).
# Lab toggle sends ccus.enabled=true as a run override.
ccus:
  enabled: false                  # off by default — toggled via Lab
  provenance: "PROJECT_PROPOSAL"
  notes: >
    CCS retrofit for high-emission steel routes. Global capture_rate 0.85 applies
    to DRI routes (concentrated CO2 streams, IEA CCUS for Steel 2023; IEAGHG 2013).
    BF-BOF uses 0.56 (whole-plant net CO2 reduction per NITI Vol.4: only ~65% of
    BF-BOF CO2 is in economically capturable streams at blast furnace off-gas; the
    rest from coke ovens/hot stoves is too dilute; 85% capture of 66% = ~56% total).
    CCUS adds $40–50/t annualised CAPEX and $12–18/t OPEX. Available from 2030.
    Vol.4 NZS Table 3.1 explicitly anticipates BF-BOF+CCS in 2070 residual fleet.
  capture_rate: 0.85              # default for DRI routes (concentrated CO2 streams)
  # Step 24: Route-specific capture rates where NITI Vol.4 gives explicit values.
  capture_rate_by_route:
    "BF-BOF": 0.56                # V4: 56% whole-plant CO2 reduction (NITI Vol.4 p.XX)
    "NG-DRI-EAF": 0.85            # IEA CCUS 2023 (no V4 override)
    "Coal-DRI-IF": 0.85           # IEA CCUS 2023 (no V4 override)
    "Coal-DRI-EAF": 0.85          # IEA CCUS 2023 (no V4 override)
  available_from_year: 2030       # no CCUS benefit before 2030
  eligible_routes:
    - "BF-BOF"
    - "NG-DRI-EAF"
    - "Coal-DRI-IF"
    - "Coal-DRI-EAF"
  additional_capex_usd_per_t:
    "BF-BOF":       48.0    # IEA CCUS for Steel 2023 [EXTERNAL]
    "NG-DRI-EAF":   35.0    # lower — NG flue gas simpler to capture [EXTERNAL]
    "Coal-DRI-IF":  42.0    # rotary kiln + capture retrofit [EXTERNAL]
    "Coal-DRI-EAF": 42.0    # same kiln process [EXTERNAL]
  additional_opex_usd_per_t:
    "BF-BOF":       18.0    # compression, transport, monitoring [EXTERNAL]
    "NG-DRI-EAF":   12.0    # [EXTERNAL]
    "Coal-DRI-IF":  15.0    # [EXTERNAL]
    "Coal-DRI-EAF": 15.0    # [EXTERNAL]

# ============================================================
# STEP 22 — TECHNOLOGY RAMP LIMITS (TIMES-style bounded optimization)
# ============================================================
# NCAP[i,t] <= max_ncap_mt_per_year[i] for each period.
# Prevents the MILP from building physically unrealistic capacity overnight.
# This is the key TIMES mechanism: even when economics favour H2-DRI strongly,
# the supply chain (electrolyser factories, specialised contractors, H2 pipelines)
# can only scale at a limited speed.
#
# CPS: conservative ramp (limited NGHM execution, lower H2 infra investment).
# NZS: faster ramp (NGHM fully funded, India achieves global electrolyser scale).
#
# Constraint 9: NCAP[i,t] <= ramp_limit[i, scenario]  for all t in model years
technology_ramp_limits:
  enabled: true
  provenance: "PROJECT_PROPOSAL"
  notes: >
    Physical scale-up limits on new capacity commissioning per year.
    Sources: IEA WEO 2023 country ramp rates; IRENA Electrolyser Capacity
    Outlook 2023; NITI Aayog NGHM roadmap. CPS reflects constrained supply
    chains; NZS reflects fully realised Mission targets + global learning spill-in.
    Applied as MILP upper bounds on NCAP[i,t]. This is the core TIMES mechanism
    that prevents over-rapid transitions — real-world counterpart to labour,
    equipment, and infrastructure bottlenecks.
  trajectories:
    # Ramp limits set at India's realistic maximum deployment rates.
    # India needs to build ~700 Mt of NEW steel capacity over 47 years (15 Mt/yr avg).
    # Limits prevent OVERNIGHT transitions while keeping the model feasible.
    # Calibration basis: India added 8-12 Mt/yr historically (all routes combined);
    # future ambition allows 2-3× that for established routes.
    # H2-DRI-EAF is nascent — limited by electrolyser factories + H2 pipeline co-build.
    CPS:
      max_ncap_mt_per_year:
        "H2-DRI-EAF":   8.0   # nascent: electrolyser supply chain limited; 2× conservative NGHM
        "Scrap-EAF":   15.0   # modular EAF, fast to build; scrap collection expanding
        "NG-DRI-EAF":  12.0   # established shaft-furnace technology; gas infra can scale
        "Coal-DRI-EAF":  5.0  # niche route in India (only Essar/JSW Hazira + announced expansions); 14 Mt existing + ~5 Mt/yr new ceiling
        "Coal-DRI-IF":   4.0  # Step 26: reduced from 8 to 4 Mt/yr in CPS. Coal-DRI-IF should not
                              # aggressively expand in CPS (Vol.4 shows it declining post-2030).
                              # 4 Mt/yr prevents pre-2028 production surge while allowing modest
                              # new investment before the 2030 NCAP cutoff. [V4_DERIVED]
    NZS:
      max_ncap_mt_per_year:
        "H2-DRI-EAF":  20.0   # NGHM fully backed + global electrolyser scale spill-in
        "Scrap-EAF":   20.0   # strong scrap infrastructure + urban mining push in NZS
        "NG-DRI-EAF":  10.0   # moderate; NZS transitions away from NG after 2040
        "Coal-DRI-EAF":  5.0  # NZS: niche route; coal discouraged; 14 Mt existing + minimal new build ceiling
        "Coal-DRI-IF":   7.0  # NZS: coal discouraged; higher carbon price limits build-out

# ============================================================
# STEP 24 — SEC IMPROVEMENT TRAJECTORY (NITI Vol.4-sourced)
# ============================================================
# Specific Energy Consumption (SEC) improves over time as Indian steel plants
# adopt best-available technology, process optimisation, and efficiency upgrades.
# Applied to: combustion CO2 emissions + fuel resource intensities (coal, gas, electricity).
# NOT applied to: process CO2 (stoichiometric — limestone/ore reduction chemistry),
#                  material resource intensities (iron ore, scrap, hydrogen).
#
# Source: NITI Aayog Vol.4 Industry Chapter, Table 3.1 / Figure 2.10
#   CPS: -12% by 2050, -23% by 2070 vs 2025 baseline
#   NZS: -24% by 2050, -38% by 2070 vs 2025 baseline
# (upper bound of Vol.4's stated NZS range of -35% to -38%)
#
# Physical basis: BF-BOF currently at 27.3 GJ/t vs global best 20-22 GJ/t.
# India's gap = 5-7 GJ/t = 20-26% improvement potential — consistent with V4 targets.
# ============================================================
sec_improvement:
  enabled: true
  provenance: "V4"
  source: "NITI Aayog Sectoral Insights: Industry Vol. 4, Table 3.1"
  notes: >
    Scenario-specific SEC improvement factors applied to fuel consumption and
    combustion CO2. CPS: moderate improvement (incremental BAT adoption).
    NZS: deeper improvement (aggressive efficiency push alongside technology shift).
    Process CO2 (stoichiometric) is excluded — chemistry does not change.
    Base year = start_year (2024). Waypoints are linearly interpolated.
  by_scenario:
    CPS:
      2050: 0.12    # -12% vs 2025 (V4 Table 3.1 CPS)
      2070: 0.23    # -23% vs 2025 (V4 Table 3.1 CPS)
    NZS:
      2050: 0.24    # -24% vs 2025 (V4 Table 3.1 NZS)
      2070: 0.38    # -38% vs 2025 (upper bound of V4's -35% to -38% range)
