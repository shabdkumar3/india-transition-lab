services:
  - type: web
    name: itl-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements_combined.txt
    startCommand: uvicorn combined_backend:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
